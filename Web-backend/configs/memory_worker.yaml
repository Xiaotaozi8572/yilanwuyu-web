# Stateless, no-secret defaults for the offline fake worker test path.
# Optional model providers remain disabled until a separately started local endpoint
# or locally installed optional dependency is deliberately injected into the worker.
schema_version: v1
limits:
  max_source_bytes: 4096
  max_proposals: 6
  max_response_bytes: 16384
  max_embedding_inputs: 16
embedding:
  dimension: 8
  normalization: L2
providers:
  candidate: fake
  embedding: fake
optional_models:
  max_concurrency: 1
  max_batch_size: 8
  max_queue_depth: 4
  max_request_bytes: 4096
  qwen:
    enabled: false
    endpoint: http://127.0.0.1:8080/v1/chat/completions
  bge_m3:
    enabled: false
    model_id: BAAI/bge-m3
