<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>翼览无余 · 语音助手</title>
<style>
  :root {
    --bg: #0e1622;
    --panel: #16233a;
    --panel-2: #1d2d49;
    --line: #2c4164;
    --text: #dce7f5;
    --muted: #8fa3c0;
    --accent: #3aa0ff;
    --ok: #35c98b;
    --warn: #f5a623;
    --err: #e5534b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    min-height: 100vh; padding: 16px;
  }
  header { text-align: center; padding: 8px 0 14px; }
  header h1 { font-size: 22px; letter-spacing: 2px; }
  header p { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 14px; max-width: 860px; margin-left: auto; margin-right: auto;
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  label { color: var(--muted); font-size: 13px; }
  input[type="number"] {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; width: 120px; font-size: 14px;
  }
  button {
    background: var(--accent); color: #06121f; border: none; border-radius: 6px;
    padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { background: #33507a; color: #7d92b5; cursor: not-allowed; }
  button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
  button.warn { background: var(--warn); color: #221200; }
  #wsStatus { color: var(--muted); font-size: 13px; margin-left: auto; }
  #stateBadge {
    display: inline-block; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 20px; padding: 5px 14px; font-size: 14px; font-weight: 700;
    min-width: 110px; text-align: center;
  }
  #stateBadge.live { border-color: var(--ok); color: var(--ok); }
  #stateBadge.speak { border-color: var(--accent); color: var(--accent); }
  #stateBadge.err { border-color: var(--err); color: var(--err); }
  #statusDetail { color: var(--muted); font-size: 13px; }
  #energyInfo { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .section-title { color: var(--muted); font-size: 12px; letter-spacing: 1px; margin-bottom: 8px; }
  #transcript { min-height: 44px; white-space: pre-wrap; line-height: 1.6; font-size: 14px; color: var(--text); }
  #answerArea .bubble {
    border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 14px; line-height: 1.7; white-space: pre-wrap;
  }
  .bubble.answer { background: #12301f; border: 1px solid #1d5a38; color: #bff0d4; }
  .bubble.fallback { background: #33260f; border: 1px solid #6b4d16; color: #f7ddb0; }
  .bubble.error { background: #3a1513; border: 1px solid #7c2a26; color: #f5b9b5; }
  .bubble.info { background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; line-height: 1.8; }
  code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>翼览无余 · 真实语音助手</h1>
  <p>AudioWorklet 采集 16kHz/mono/16-bit PCM · MP3 整段播报 · 支持打断与断网降级</p>
</header>

<div class="panel">
  <div class="row">
    <label for="wsPort">语音服务端口</label>
    <input id="wsPort" type="number" min="1" max="65535" value="8765" />
    <button id="btnStart">开始说话</button>
    <button id="btnStop" class="secondary" disabled>说完 / 结束输入</button>
    <button id="btnBarge" class="warn" disabled>打断播报</button>
    <span id="wsStatus">未连接</span>
  </div>
  <div class="hint">
    使用步骤：1) 先运行 <code>python scripts/run_voice.py</code>，记下打印的语音端口；
    2) 在此填入该端口（或访问 <code>index.html?port=端口</code>）；
    3) 点击「开始说话」并授权麦克风；说话停顿约 0.6 秒自动结束（与服务器 VAD 同步），
    或点击「说完」手动结束。播报期间可点击「打断播报」。
  </div>
</div>

<div class="panel">
  <div class="row">
    <span id="stateBadge">IDLE</span>
    <span id="statusDetail">等待开始</span>
    <span id="energyInfo"></span>
  </div>
</div>

<div class="panel">
  <div class="section-title">实时识别文字</div>
  <div id="transcript">（暂无）</div>
</div>

<div class="panel">
  <div class="section-title">解答与提示</div>
  <div id="answerArea"></div>
</div>

<!-- 整段 MP3 播放器（每段一个完整 MP3 blob，不分块解码） -->
<audio id="ttsAudio" hidden playsinline></audio>

<script>
"use strict";
(function () {
  /* ================================================================
   * T9 · 翼览无余 语音前端
   *
   * 协议与 src/voice/websocket_server.py 二步成帧严格对齐：
   *   - 上行：session.start → (audio.frame JSON 头 + binary PCM)… → audio.end
   *   - 打断：session.cancel（服务器既有 barge-in 机制，回 barge_in.accepted）
   *   - 下行：binary = 完整 MP3 chunk（无 JSON 包装）；JSON 事件见 handleJson
   *
   * 关键机制 —— 客户端镜像 VAD：
   *   服务器在 handle_frame 中对「当前状态 != LISTENING」时到达的音频帧
   *   会直接判协议错误并断开（4400）。因此客户端必须赶在服务器 VAD 触发
   *   VOICE_END（连续静音 >= endpoint_silence_ms）之前停止上行，且停帧时机
   *   必须与服务器完全一致：客户端与服务器看到的是同一条能量流（同一帧、
   *   同一个 float），按相同参数（vad_threshold / endpoint_silence_ms /
   *   frame_duration_ms）镜像计数，即可在服务器判定 VOICE_END 的同一帧停发，
   *   随后补发一条 audio.end 作为输入关闭信号。
   *
   * 说明：协议不存在「ack」上行帧（服务器仅接受 5 种上行类型，新增即断开），
   *       播报节奏由服务器 PlaybackHandle 控制，前端以 playback.completed 收尾。
   * ================================================================ */

  var SAMPLE_RATE = 16000;
  var CHANNELS = 1;
  var FRAME_MS = 20;
  var WS_HOSTS = ["127.0.0.1", "localhost"];

  /* 镜像 VAD 参数：必须与 configs/voice.yaml 的 vad_threshold / endpoint_silence_ms 一致
   * （T7 若重新标定这两个值，需同步修改此处）。 */
  var VAD_THRESHOLD = 0.2;      // voice.yaml: vad_threshold
  var END_SILENCE_MS = 600;     // voice.yaml: endpoint_silence_ms

  var NO_ANSWER_WATCH_MS = 20000; // 结束输入后无任何服务器事件时的兜底提示
  var CLOSE_AFTER_PLAYBACK_MS = 12000; // 播报完成后关闭连接的最长等待
  var STATE_LABELS = {
    IDLE: "空闲", LISTENING: "聆听中", TRANSCRIBING: "识别中",
    UNDERSTANDING: "理解中", RETRIEVING: "检索中", GENERATING: "生成中",
    SPEAKING: "播报中", INTERRUPTED: "已打断", REWRITE: "追问中", CLARIFY: "澄清中"
  };
  var PROCESSING_STATES = ["TRANSCRIBING", "UNDERSTANDING", "RETRIEVING",
    "GENERATING", "SPEAKING", "INTERRUPTED", "REWRITE", "CLARIFY"];

  function $(id) { return document.getElementById(id); }
  var elPort = $("wsPort"), elBtnStart = $("btnStart"), elBtnStop = $("btnStop"),
      elBtnBarge = $("btnBarge"), elWsStatus = $("wsStatus"), elStateBadge = $("stateBadge"),
      elStatusDetail = $("statusDetail"), elEnergy = $("energyInfo"),
      elTranscript = $("transcript"), elAnswer = $("answerArea"), elTtsAudio = $("ttsAudio");

  /* ---------------- 运行状态 ---------------- */
  var ws = null;
  var intentionalClose = false;
  var audioContext = null;
  var micStream = null;
  var workletNode = null;
  var sessionIds = null;      // {session_id, turn_id, audio_stream_id}
  var sequenceCounter = 0;    // 每条 WS 连接从 0 递增（服务器按连接校验）
  var capturing = false;      // 正在采集上行音频
  var inputEnded = false;     // 已发 audio.end，禁止再发帧
  var turnComplete = false;   // 服务器已结束本 turn（playback.completed 等）
  var sawProcessing = false;  // 服务器是否已进入处理阶段（抑制无应答兜底）
  var playbackQueue = [];     // 待播 MP3 ArrayBuffer 队列（整段播放）
  var playing = false;
  var lastAnswerText = "";    // 最近一次 answer.display 文本（降级展示用）
  var lastEnergy = 0;
  var lastEnergyAt = 0;
  var closeTimer = null;
  var noAnswerTimer = null;

  /* 镜像 VAD 状态（与服务器 voice.vad 同参数） */
  var vadActive = false;      // 已见过语音（对应服务器 VAD active）
  var vadSilenceMs = 0;       // 当前连续静音毫秒数

  function newId(prefix) {
    return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 10);
  }

  /* ---------------- 页面工具 ---------------- */
  function setBadge(state, klass) {
    elStateBadge.textContent = state;
    elStateBadge.className = klass || "";
  }

  function setDetail(text) { elStatusDetail.textContent = text; }

  function setWsStatus(text) { elWsStatus.textContent = text; }

  function addBubble(kind, text) {
    var div = document.createElement("div");
    div.className = "bubble " + kind;
    div.textContent = text;
    elAnswer.appendChild(div);
    return div;
  }

  function setTranscript(text) {
    elTranscript.textContent = text || "（暂无）";
  }

  function refreshEnergy() {
    var now = performance.now();
    if (now - lastEnergyAt < 250) return; // 节流，避免 20ms 一次 DOM 更新
    lastEnergyAt = now;
    var pct = (lastEnergy * 100).toFixed(1);
    elEnergy.textContent = "帧能量 " + pct + "%（≥20% 才触发服务器 VAD 语音开始）";
  }

  /* ---------------- WS 地址解析与校验（仅本机） ---------------- */
  function buildWsUrl() {
    var params = new URLSearchParams(window.location.search);
    var raw = params.get("ws");
    var port = params.get("port");
    if (raw) {
      if (!/^ws:\/\//i.test(raw)) raw = "ws://" + raw;
      var parsed = new URL(raw);
      if (parsed.protocol !== "ws:" || WS_HOSTS.indexOf(parsed.hostname) === -1 || !parsed.port) {
        throw new Error("?ws= 参数仅允许本机地址，如 ws://127.0.0.1:8765");
      }
      return parsed.href;
    }
    var p = port ? parseInt(port, 10) : parseInt(elPort.value, 10);
    if (isNaN(p) || p < 1 || p > 65535) throw new Error("语音服务端口无效：" + elPort.value);
    return "ws://127.0.0.1:" + p;
  }

  /* ---------------- 生命周期：开始说话 ---------------- */
  function onStart() {
    if (capturing || (ws && ws.readyState === WebSocket.OPEN)) {
      setDetail("已在会话中，请先等待本轮结束");
      return;
    }
    var url;
    try { url = buildWsUrl(); } catch (err) {
      addBubble("error", err.message);
      return;
    }
    sessionIds = {
      session_id: newId("web_sess"),
      turn_id: newId("web_turn"),
      audio_stream_id: newId("web_stream")
    };
    sequenceCounter = 0;
    inputEnded = false;
    turnComplete = false;
    sawProcessing = false;
    vadActive = false;
    vadSilenceMs = 0;
    intentionalClose = false;
    clearPlayback();
    setTranscript("（暂无）");
    elAnswer.innerHTML = "";
    setBadge("IDLE", "");
    setDetail("正在连接语音服务 " + url + " …");
    setWsStatus("连接中…");
    elBtnStart.disabled = true;
    openSocket(url);
  }

  function openSocket(url) {
    var socket;
    try {
      socket = new WebSocket(url);
    } catch (err) {
      failStart("无法创建 WebSocket 连接：" + err.message);
      return;
    }
    socket.binaryType = "arraybuffer"; // 下行 MP3 chunk 以 ArrayBuffer 接收
    ws = socket;

    socket.onopen = function () {
      setWsStatus("已连接");
      setDetail("会话建立中…");
      sendSessionStart();
    };

    socket.onmessage = function (ev) {
      if (typeof ev.data === "string") {
        var event;
        try { event = JSON.parse(ev.data); } catch (e) { return; }
        handleJson(event);
      } else if (ev.data instanceof ArrayBuffer) {
        queuePlayback(ev.data); // binary = 完整 MP3 chunk（整段播放）
      } else if (ev.data && typeof ev.data.arrayBuffer === "function") {
        ev.data.arrayBuffer().then(queuePlayback).catch(function () {});
      }
    };

    socket.onerror = function () {
      setWsStatus("连接错误");
      addBubble("error", "无法连接语音服务，请确认 scripts/run_voice.py 已启动且端口正确。");
    };

    socket.onclose = function (ev) {
      if (ws === socket) ws = null;
      stopCaptureInternal();
      setBadge("IDLE", "");
      elBtnStart.disabled = false;
      elBtnStop.disabled = true;
      elBtnBarge.disabled = true;
      if (intentionalClose) {
        setWsStatus("已断开");
        setDetail("本轮结束，可点击「开始说话」继续下一轮");
      } else {
        setWsStatus("连接断开" + (ev.code ? "（" + ev.code + "）" : ""));
        setDetail("连接已断开，请点击「开始说话」重试");
        addBubble("error", "连接意外断开（关闭码 " + (ev.code || "未知") + "）。" +
          "若为 4400/4401：可能在上行期间发送了服务器不允许的帧（如已进入识别阶段后仍有音频帧）。");
      }
    };
  }

  function sendSessionStart() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({
      type: "session.start",
      session_id: sessionIds.session_id,
      turn_id: sessionIds.turn_id,
      audio_stream_id: sessionIds.audio_stream_id
    }));
    startMic().catch(function (err) {
      addBubble("error", "麦克风启动失败：" + err.message);
      setDetail("麦克风不可用，本轮取消");
      closeTurnWs();
    });
  }

  /* ---------------- 麦克风采集（AudioWorklet，禁止 ScriptProcessorNode） ---------------- */
  async function startMic() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("当前浏览器不支持麦克风采集（需安全上下文，本页使用 127.0.0.1）");
    }
    if (!window.AudioContext || !window.AudioWorkletNode) {
      throw new Error("当前浏览器不支持 AudioWorklet，请使用新版 Chrome / Edge");
    }
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          sampleRate: SAMPLE_RATE, channelCount: CHANNELS,
          echoCancellation: true, noiseSuppression: true
        }
      });
    } catch (err) {
      if (err && (err.name === "NotAllowedError" || err.name === "PermissionDeniedError")) {
        addBubble("error", "麦克风权限被拒绝：请在浏览器地址栏左侧的权限图标中允许麦克风，然后重试。");
      } else if (err && err.name === "NotFoundError") {
        addBubble("error", "未检测到麦克风设备，请连接麦克风后重试。");
      }
      throw err;
    }
    try {
      audioContext = new AudioContext({ sampleRate: SAMPLE_RATE });
    } catch (e) {
      audioContext = new AudioContext(); // 旧浏览器不支持 sampleRate 选项：worklet 内重采样
    }
    if (audioContext.state === "suspended") {
      try { await audioContext.resume(); } catch (e) { /* 由后续 play 触发恢复 */ }
    }
    await audioContext.audioWorklet.addModule("pcm-processor.js");
    workletNode = new AudioWorkletNode(audioContext, "pcm-frame-processor", {
      numberOfInputs: 1,
      numberOfOutputs: 1,
      processorOptions: { targetSampleRate: SAMPLE_RATE, frameDurationMs: FRAME_MS }
    });
    workletNode.port.onmessage = onPcmFrame;
    var source = audioContext.createMediaStreamSource(micStream);
    source.connect(workletNode);
    capturing = true;
    inputEnded = false;
    setBadge("LISTENING", "live");
    setDetail("正在聆听…（停顿约 0.6 秒自动结束，或点击「说完」）");
    elBtnStop.disabled = false;
    elBtnBarge.disabled = false;
    if (audioContext.sampleRate !== SAMPLE_RATE) {
      addBubble("info", "浏览器未采纳 16kHz 采样（实际 " + audioContext.sampleRate + "Hz），已由 AudioWorklet 内部重采样到 16kHz。");
    }
  }

  /* worklet 每 20ms 一帧：JSON 头 + binary PCM（二步成帧）+ 镜像 VAD */
  function onPcmFrame(msg) {
    lastEnergy = msg.energy;
    refreshEnergy();
    if (!capturing || inputEnded || !ws || ws.readyState !== WebSocket.OPEN) return;

    /* 镜像 VAD：与服务器同一参数、同一条能量流，计数完全一致 */
    if (msg.energy >= VAD_THRESHOLD) {
      vadActive = true;
      vadSilenceMs = 0;
    } else if (vadActive) {
      vadSilenceMs += FRAME_MS;
    }

    var header = {
      type: "audio.frame",
      session_id: sessionIds.session_id,
      turn_id: sessionIds.turn_id,
      audio_stream_id: sessionIds.audio_stream_id,
      sequence: sequenceCounter,
      sample_rate: SAMPLE_RATE,
      channels: CHANNELS,
      timestamp_ms: msg.timestampMs,
      energy: msg.energy
    };
    sequenceCounter += 1;
    ws.send(JSON.stringify(header));
    ws.send(msg.buffer); // 16-bit PCM，640 字节

    /* 服务器在「本帧」判定 VOICE_END（静音 >= 600ms）——本帧已发送，
     * 立即停发后续帧并补 audio.end，避免任何帧在 TRANSCRIBING 状态到达服务器。 */
    if (vadActive && vadSilenceMs >= END_SILENCE_MS) {
      stopCaptureAndEndInput("检测到语音结束（静音 " + END_SILENCE_MS + "ms），停止上行");
    }
  }

  function onStop() {
    if (capturing && !inputEnded) stopCaptureAndEndInput("手动结束输入");
  }

  function stopCaptureAndEndInput(reason) {
    if (inputEnded) return;
    inputEnded = true;
    stopCaptureInternal();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({
        type: "audio.end",
        session_id: sessionIds.session_id,
        turn_id: sessionIds.turn_id,
        audio_stream_id: sessionIds.audio_stream_id
      }));
    }
    setDetail(reason + "，等待识别…");
    elBtnStop.disabled = true;
    clearTimeout(noAnswerTimer);
    noAnswerTimer = setTimeout(function () {
      if (!sawProcessing && ws && ws.readyState === WebSocket.OPEN) {
        addBubble("info", "长时间未收到服务器应答。可能原因：语音能量过低未触发 VAD（参考「帧能量」显示，需 ≥20%），或识别/合成耗时过长。已自动结束本轮。");
        closeTurnWs();
      }
    }, NO_ANSWER_WATCH_MS);
  }

  function stopCaptureInternal() {
    capturing = false;
    if (workletNode) {
      try { workletNode.port.close(); } catch (e) { /* 忽略 */ }
      try { workletNode.disconnect(); } catch (e) { /* 忽略 */ }
      workletNode = null;
    }
    if (micStream) {
      micStream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) { /* 忽略 */ } });
      micStream = null;
    }
    if (audioContext) {
      try {
        if (audioContext.state !== "closed") audioContext.close();
      } catch (e) { /* 忽略 */ }
      audioContext = null;
    }
  }

  /* ---------------- 下行 JSON 事件 ---------------- */
  function handleJson(event) {
    var type = event.type;
    if (type === "voice.state") {
      onVoiceState(event);
    } else if (type === "asr.partial" || type === "asr.final") {
      sawProcessing = true;
      if (capturing && !inputEnded) stopCaptureAndEndInput("服务器开始识别，结束输入");
      setTranscript((type === "asr.final" ? "[最终] " : "[临时] ") +
        (event.transcript || "") + "（置信度 " + Math.round((event.confidence || 0) * 100) + "%）");
    } else if (type === "answer.display") {
      sawProcessing = true;
      if (capturing && !inputEnded) stopCaptureAndEndInput("服务器已生成解答，结束输入");
      lastAnswerText = extractAnswerText(event.answer);
      setDetail("已生成解答，开始语音播报");
      addBubble("answer", lastAnswerText || "（解答为空）");
    } else if (type === "clarification.required") {
      sawProcessing = true;
      var reason = REASON_LABELS[event.reason] || event.reason || "voice_input_unclear";
      addBubble("info", "需要澄清：请说得更完整一些（" + reason + "）。");
      turnComplete = true;
      closeTurnWs();
    } else if (type === "voice.error") {
      sawProcessing = true;
      clearPlayback();
      addBubble("error", "语音服务错误：" + (event.code || "未知") + "（" + (event.field || "") + "）");
    } else if (type === "playback.failed") {
      sawProcessing = true;
      clearPlayback();
      showFallbackBubble();
      setDetail("播报失败，已降级为文字展示");
    } else if (type === "barge_in.accepted") {
      clearPlayback();
      addBubble("info", "已收到打断指令（" + (event.status || "") + "）。");
    }
    /* 其他未知事件一律忽略，不中断会话 */
  }

  var REASON_LABELS = {
    voice_input_unclear: "语音不够清晰",
    asr_provider_unavailable: "识别服务不可用",
    asr_final_missing: "未能完成识别",
    asr_processing_failed: "识别处理失败",
    spoken_playback_failed: "语音播报失败"
  };

  function onVoiceState(event) {
    var state = event.state || "";
    var status = event.status || "";
    if (state === "SPEAKING") {
      setBadge("SPEAKING", "speak");
      setDetail("语音播报中…（可点击「打断播报」）");
    } else if (state === "TRANSCRIBING") {
      setBadge("TRANSCRIBING", "live");
      setDetail("识别中…");
      if (capturing && !inputEnded) stopCaptureAndEndInput("服务器已进入识别阶段，结束输入");
    } else if (state && state !== "LISTENING" && state !== "IDLE") {
      var klass = (state === "INTERRUPTED" || state === "CLARIFY") ? "err" : "live";
      setBadge(state, klass);
      setDetail(statusLabel(status));
    }
    if (PROCESSING_STATES.indexOf(state) !== -1) sawProcessing = true;
    if (status === "playback.completed") {
      sawProcessing = true;
      turnComplete = true;
      setDetail("播报完成");
      if (capturing && !inputEnded) stopCaptureAndEndInput("播报完成");
      clearTimeout(closeTimer);
      closeTimer = setTimeout(closeTurnWs, CLOSE_AFTER_PLAYBACK_MS);
      maybeCloseTurnWs();
    } else if (status === "playback.failed") {
      sawProcessing = true;
      clearPlayback();
      showFallbackBubble();
      setDetail("播报失败，已降级为文字展示");
    } else if (status === "session.started") {
      setDetail("会话已建立，等待音频帧…");
    } else if (status === "audio.input_ended") {
      setDetail("服务端已收到结束信号，处理中…");
    }
  }

  function statusLabel(status) {
    var labels = {
      "session.started": "会话已建立",
      "scene.updated": "场景已更新",
      "frame_accepted": "聆听中…",
      "partial": "处理中…",
      "pre_retrieval": "预检索中…",
      "clarification": "需要澄清",
      "answered": "已生成解答",
      "playback.completed": "播报完成",
      "playback.failed": "播报失败",
      "audio.input_ended": "输入已结束"
    };
    return labels[status] || status;
  }

  function extractAnswerText(answer) {
    if (!answer || typeof answer !== "object") return "";
    return answer.main_answer || answer.short_answer || "";
  }

  function showFallbackBubble() {
    if (lastAnswerText) {
      addBubble("fallback", "网络波动，语音播报中断，请阅读以下文字解答：\n" + lastAnswerText);
    } else {
      addBubble("fallback", "语音播报失败，请稍后重试或改用文字查询。");
    }
  }

  /* ---------------- 下行播放：整段 MP3 blob（禁止分块解码） ---------------- */
  function queuePlayback(data) {
    if (!(data instanceof ArrayBuffer)) return;
    playbackQueue.push(data);
    playNext();
  }

  function playNext() {
    if (playing) return;
    if (playbackQueue.length === 0) {
      playing = false;
      maybeCloseTurnWs();
      return;
    }
    playing = true;
    var bytes = playbackQueue.shift();
    var blob = new Blob([bytes], { type: "audio/mpeg" }); // 整段 MP3，不分块解码
    var url = URL.createObjectURL(blob);
    elTtsAudio.src = url;
    elTtsAudio.onended = function () {
      URL.revokeObjectURL(url);
      elTtsAudio.src = "";
      playing = false;
      playNext();
    };
    elTtsAudio.onerror = function () {
      URL.revokeObjectURL(url);
      elTtsAudio.src = "";
      playing = false;
      addBubble("error", "MP3 播放失败（浏览器无法解码该音频段）");
      playNext();
    };
    elTtsAudio.play().catch(function (err) {
      // 自动播放受限时降级为文字提示（answer.display 气泡已展示）
      URL.revokeObjectURL(url);
      elTtsAudio.src = "";
      playing = false;
      addBubble("info", "无法自动播放语音（" + err.message + "），请阅读上方文字解答。");
      playNext();
    });
  }

  function clearPlayback() {
    if (elTtsAudio) {
      try { elTtsAudio.pause(); } catch (e) { /* 忽略 */ }
      elTtsAudio.src = "";
      elTtsAudio.onended = null;
      elTtsAudio.onerror = null;
    }
    playbackQueue = [];
    playing = false;
  }

  /* ---------------- 打断（复用既有 barge-in 机制：session.cancel） ---------------- */
  function onBarge() {
    if (!ws || ws.readyState !== WebSocket.OPEN || !sessionIds) return;
    clearPlayback(); // 立即停止本地播报
    ws.send(JSON.stringify({
      type: "session.cancel",
      session_id: sessionIds.session_id,
      turn_id: sessionIds.turn_id,
      audio_stream_id: sessionIds.audio_stream_id,
      feedback: "停止"
    }));
    setDetail("已发送打断指令…");
  }

  /* ---------------- 收尾 ---------------- */
  function maybeCloseTurnWs() {
    if (turnComplete && ws && ws.readyState === WebSocket.OPEN &&
        playbackQueue.length === 0 && !playing) {
      closeTurnWs();
    }
  }

  function closeTurnWs() {
    clearTimeout(closeTimer);
    clearTimeout(noAnswerTimer);
    if (ws && ws.readyState === WebSocket.OPEN) {
      intentionalClose = true;
      try { ws.close(1000, "turn_done"); } catch (e) { /* 忽略 */ }
    }
    if (capturing && !inputEnded) stopCaptureAndEndInput("本轮结束");
  }

  function failStart(msg) {
    setBadge("IDLE", "err");
    setDetail(msg);
    setWsStatus("未连接");
    elBtnStart.disabled = false;
    elBtnStop.disabled = true;
    elBtnBarge.disabled = true;
    addBubble("error", msg);
  }

  /* ---------------- 事件绑定与初始化 ---------------- */
  elBtnStart.addEventListener("click", onStart);
  elBtnStop.addEventListener("click", onStop);
  elBtnBarge.addEventListener("click", onBarge);
  window.addEventListener("beforeunload", function () {
    clearPlayback();
    stopCaptureInternal();
    if (ws) { try { ws.close(1000, "page_close"); } catch (e) { /* 忽略 */ } }
  });

  // URL 参数预填端口：index.html?port=8765 或 ?ws=ws://127.0.0.1:8765
  (function initFromUrl() {
    var params = new URLSearchParams(window.location.search);
    if (params.get("port")) elPort.value = params.get("port");
    if (params.get("ws")) {
      elPort.disabled = true;
      setWsStatus("使用 ?ws= 指定地址");
      elPort.placeholder = "由 ?ws= 参数指定";
    }
  })();
})();
</script>
</body>
