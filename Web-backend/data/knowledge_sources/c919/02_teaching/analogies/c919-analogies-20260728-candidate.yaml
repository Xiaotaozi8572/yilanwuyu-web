# C919 科普类比素材库
# 来源说明：本文件基于 01_science 已收集的 C919 公开事实派生，用于教学组织（teaching_organization），不作为科学事实证据源。数据截至 2026-07-28。
# 字段：id / concept / analogy / explanation

version: "v1"
aircraft: "c919"
content_nature: "teaching_organization"
analogies:
  - id: "ana-001-bypass-ratio-gear-ratio"
    concept: "涵道比（Bypass Ratio）"
    analogy: "自行车的齿轮比"
    explanation: >
      涵道比是涡扇发动机外涵道与内涵道的空气流量之比。就像自行车的齿轮比——
      低齿轮比（低涵道比）适合爬坡、加速，高齿轮比（高涵道比）适合平路巡航。
      LEAP-1C 的涵道比约 11:1，相当于 11 份空气中约 10 份走外涵道（只加速不烧油，省油、推力大），
      只有约 1 份进入核心机参与燃烧。高涵道比省油，但推力响应会稍慢，需要在省油与响应之间平衡。

  - id: "ana-002-fly-by-wire-gamepad"
    concept: "电传操纵（Fly-By-Wire）"
    analogy: "用游戏手柄操控屏幕里的角色"
    explanation: >
      传统飞机像老式自行车——钢索直接连着车把，打方向费劲且机械传递。
      C919 的电传操纵像用游戏手柄玩游戏：侧杆（手柄）→ 飞控计算机（游戏机主机）→ 舵面作动器（屏幕里的角色动作）。
      中间没有机械钢索，全靠电信号。四余度设计相当于有 4 台"备用游戏机"同时在线，
      坏掉 3 台还剩 1 台能继续操控。注意：电传只改变"操纵方式"，不等于自动驾驶。

  - id: "ana-003-composite-sandwich"
    concept: "复合材料（Composites）"
    analogy: "三明治结构"
    explanation: >
      碳纤维复合材料像三明治——碳纤维是中间的"骨架"（承力），树脂是夹住骨架的"面包"（固定形状）。
      同样强度下比铝合金轻得多（约铝合金重量的 60%）。C919 复合材料占比约 12%，
      主要用于尾翼、整流罩等非主要承力部件。但不是越多越好：复合材料成本高、损伤检测难、维修复杂，
      需在减重、成本和可维修性之间平衡。

  - id: "ana-004-supercritical-wing-flipped"
    concept: "超临界机翼（Supercritical Wing）"
    analogy: "把传统翼型'翻转'过来调一调"
    explanation: >
      传统机翼像拱桥——上表面弯度大，气流加速快但高速时容易"撞墙"（产生激波）。
      超临界机翼像把拱桥"压平"：上表面平坦，下表面弯度更大，靠后缘的凹形补回升力。
      气流能平顺流过，激波出现得晚、强度弱。C919 的超临界机翼使气动效率提升约 20%、阻力降低约 8%。

  - id: "ana-005-turbofan-multistage-fan"
    concept: "涡扇发动机（Turbofan）"
    analogy: "一台多级风扇"
    explanation: >
      涡扇发动机可以理解为"一台多级风扇"：最前面是大风扇（把大部分空气向后吹，产生大部分推力），
      中间是压气机（把进入核心的空气压密），核心是燃烧室（烧油加热气体），
      最后是涡轮（被高温气体推动，反过来带动前面的大风扇和压气机）。
      LEAP-1C 的大风扇采用碳纤维复合材料叶片，比传统金属叶片轻，允许更大风扇直径。

  - id: "ana-006-airworthiness-driving-license"
    concept: "适航认证（Airworthiness Certification）"
    analogy: "考驾照"
    explanation: >
      一款新客机要"上路"必须拿三本证：型号合格证（TC）= 拿到驾照，证明设计合格；
      生产许可证（PC）= 考了教练证，证明具备批量造的能力；单机适航证（AC）= 每辆车的年检合格证，
      证明这一架具体飞机可以飞。C919 的"驾照考试"历时约 8 年（2015-2022），6 架原型机试飞，
      依据 CCAR-25 部（等效 FAA Part 25 / EASA CS-25）。

  - id: "ana-007-mtow-elevator-load"
    concept: "最大起飞重量 MTOW"
    analogy: "电梯的载重限制"
    explanation: >
      电梯门上写着"限载 1000 公斤"，超过就报警不动。飞机的 MTOW（最大起飞重量）是类似的硬限制——
      飞机总重（机体+燃油+乘客+货物）超过这个数就不能起飞。C919 基本型 MTOW 为 77,300 公斤，
      最大商载约 20.4 吨。航程、载客、载货三者要在 MTOW 之内相互"让位"：想飞更远就多加油，
      油多了就得少装人或货。

  - id: "ana-008-bypass-ratio-fuel-jog-sprint"
    concept: "涵道比与燃油效率"
    analogy: "慢跑与冲刺"
    explanation: >
      高涵道比发动机像慢跑——动作幅度大、节奏稳、单位能耗低，适合长时间巡航；
      低涵道比发动机像百米冲刺——响应快、爆发力强，但单位能耗高。
      民航客机大部分时间在巡航，所以倾向于高涵道比（省油优先），
      但涵道比过大会让发动机直径变大、推力响应变慢、低速性能受影响，因此需要平衡。
      C919 的 LEAP-1C 涵道比约 11:1，是当代窄体客机的主流选择。

  - id: "ana-009-winglet-fence"
    concept: "翼尖小翼（Winglet）"
    analogy: "路口的挡风板"
    explanation: >
      机翼下面气压高、上面气压低，到了翼尖，下面的高压空气会往上翻卷，形成旋转的涡流，
      偷走能量变成诱导阻力。翼尖小翼像在路口装了一块挡板，挡住气流乱翻，削弱翼尖涡。
      C919 采用融合式翼尖小翼，过渡更光滑，能降低诱导阻力约 4-5%。一架每天飞几个航班的客机，
      一年省下的燃油非常可观。

  - id: "ana-010-quadruplex-redundancy"
    concept: "四余度飞控（Quadruplex Redundancy）"
    analogy: "四个司机同时握方向盘"
    explanation: >
      C919 的电传飞控有 4 套完全独立的计算机并行工作，就像 4 个司机同时握方向盘。
      其中 1 个突然松手，另外 3 个仍然能安全驾驶；即使坏到只剩最后 1 个，也能把车开回去。
      这种设计确保任意单点故障不会影响正常飞行，是民机电传飞控安全冗余的典型做法。
