# C919 系统专项类比素材库
# 来源说明：本文件基于 01_science 已收集的 C919 公开事实派生，用于教学组织（teaching_organization），不作为科学事实证据源。数据截至 2026-07-28。
# 字段：id / concept / analogy / explanation

version: "v1"
aircraft: "c919"
content_nature: "teaching_organization"
analogies:
  - id: "sys-ana-001-supercritical-flipped-airfoil"
    concept: "超临界机翼（Supercritical Wing）"
    analogy: "翻转的翼型——上表面平坦、下曲面弯曲"
    explanation: >
      传统机翼像拱桥，上表面弯度大，跨声速飞行时气流加速过快容易在上方“撞墙”形成激波。
      超临界机翼像是把传统翼型“翻转”过来调一调：上表面变平坦、下表面弯度变大，靠后缘凹形补回升力。
      这样气流流过更平顺，激波出现晚、强度弱。C919 的超临界机翼使气动效率提升约 20%、阻力降低约 8%。

  - id: "sys-ana-002-bypass-ratio-faucet"
    concept: "涵道比（Bypass Ratio）"
    analogy: "水龙头的水流分配（内涵道 vs 外涵道气流）"
    explanation: >
      涵道比是涡扇发动机外涵道与内涵道空气流量之比，可以类比为水龙头的水流分配——
      大部分水（空气）从外管直接流走（外涵道，只加速不烧油），小部分水（空气）走内管去加热（内涵道，进核心机燃烧）。
      LEAP-1C 涵道比约 11:1，意味着 11 份空气中约 10 份走外涵道、1 份进核心机。外涵道气流多则省油、推力大，
      但“水龙头”开太大，大风扇惯量大、推力响应会变慢，需在省油与响应之间平衡。

  - id: "sys-ana-003-fly-by-wire-gamepad"
    concept: "电传操纵（Fly-By-Wire）"
    analogy: "用游戏手柄操控飞机（电信号代替机械拉杆）"
    explanation: >
      传统飞机像老式自行车，钢索直接连着车把，打方向费力且靠机械传递。C919 的电传操纵像用游戏手柄玩游戏：
      侧杆（手柄）→飞控计算机（游戏机主机）→舵面作动器（屏幕里角色的动作），中间没有机械钢索，全靠电信号。
      四余度设计相当于 4 台备用主机同时在线，坏掉 3 台还剩 1 台能继续操控。注意：电传只改变“操纵方式”，不等于自动驾驶。

  - id: "sys-ana-004-apu-power-bank"
    concept: "辅助动力装置（APU）"
    analogy: "飞机的“充电宝”（地面供电供气）"
    explanation: >
      APU（Auxiliary Power Unit）是装在飞机尾部的辅助动力装置，可以理解为飞机自带的“充电宝”——
      在地面主发动机不工作时，它提供电力和压缩空气，用于启动主发动机、空调、照明和电子设备。
      APU 本身不产生推力（不帮飞机往前飞），只是“供电供气”。飞机起飞后主发动机接手供电供气，APU 通常进入待机或关闭。

  - id: "sys-ana-005-winglet-stern-flap"
    concept: "翼尖小翼（Winglet）"
    analogy: "船尾的挡板（阻止翼尖涡流）"
    explanation: >
      机翼下方气压高、上方气压低，到了翼尖，下方高压空气向上翻卷形成旋转涡流，偷走能量变成诱导阻力。
      翼尖小翼像在船尾装一块挡板，挡住水流乱卷；同样地，它挡住翼尖气流向上翻卷，削弱翼尖涡。
      C919 采用融合式翼尖小翼，翼展从 33.6 米增至 35.8 米，过渡更光滑，降低诱导阻力约 3-5%。

  - id: "sys-ana-006-airworthiness-car-inspection"
    concept: "适航取证（Airworthiness Certification）"
    analogy: "汽车年检（但严格 100 倍）"
    explanation: >
      汽车每年要年检证明还能安全上路，飞机的适航取证类似但严格得多——要验证性能、结构、系统、紧急撤离等数千项，
      历时数年、用多架原型机试飞。C919 依据 CCAR-25 部取证历时约 8 年。拿到型号合格证（TC）相当于“设计合格证”，
      生产许可证（PC）相当于“批量制造资格证”，单机适航证（AC）相当于“这一架能上路的年检证”。取证后还要持续适航终身维护。

  - id: "sys-ana-007-ins-eyes-closed"
    concept: "惯性导航系统（INS）"
    analogy: "闭眼走路靠体感（陀螺仪和加速度计）"
    explanation: >
      惯性导航系统（INS）靠内部的陀螺仪和加速度计感知飞机的角速度和加速度，通过积分计算出当前位置和姿态，
      就像人闭着眼睛走路——靠身体的感觉（前庭系统）判断走了多远、转了多少弯，不需要看外面也不依赖 GPS。
      但惯性导航会随时间累积漂移（就像闭眼走得越久越偏），需要 GPS 定期校正。C919 的惯导与 GPS、北斗等多源融合导航。

  - id: "sys-ana-008-composite-sandwich-honeycomb"
    concept: "复合材料结构（Composite Structure）"
    analogy: "三明治结构（碳纤维皮 + 蜂窝芯）"
    explanation: >
      碳纤维复合材料结构件常做成“三明治”——两面是碳纤维层压板（像面包，承力），
      中间是蜂窝芯或泡沫芯（像夹心，撑起形状、增加厚度提升抗弯刚度）。
      同样强度下比铝合金轻得多。C919 复合材料约占 12%，主要用于尾翼、整流罩等部位。
      但复合材料成本高、损伤检测难、修理复杂，需在减重与成本/可维修性之间平衡。

  - id: "sys-ana-009-turbofan-multistage-fan"
    concept: "涡扇发动机（Turbofan）"
    analogy: "多级风扇（外涵道冷气流 + 内涵道热气流）"
    explanation: >
      涡扇发动机可以理解为“一台多级风扇”：最前面是大风扇，把大部分空气向后吹产生大部分推力（外涵道冷气流）；
      中间是压气机把进入核心的空气压密，核心是燃烧室烧油加热气体，最后是涡轮被热气推动反过来带动前面的大风扇和压气机（内涵道热气流）。
      LEAP-1C 涵道比约 11:1，意味着大部分推力来自外涵道的冷气流。碳纤维复合材料风扇叶片比金属叶片轻，允许更大风扇直径。

  - id: "sys-ana-010-redundancy-three-vote"
    concept: "余度管理（Redundancy Management）"
    analogy: "三人表决（多套系统交叉验证）"
    explanation: >
      C919 的飞控、航电等关键系统采用余度设计，就像“三人表决”——多套独立系统同时计算同一个指令，
      通过比较输出结果判断哪套出了问题。电传飞控是四余度架构，相当于四个人表决，少数服从多数；
      任意单点故障会被其余系统识别并隔离，不影响正常飞行。这是民机电传飞控安全冗余的典型做法，
      确保在故障情况下仍能安全操纵。
