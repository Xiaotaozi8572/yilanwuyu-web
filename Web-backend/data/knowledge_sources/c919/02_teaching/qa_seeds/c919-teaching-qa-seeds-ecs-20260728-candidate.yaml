# C919 环控专项讲解侧问答种子（非评测种子）
# 来源说明：本文件基于 01_science 已收集的 C919 公开事实派生，用于教学组织（teaching_organization），不作为科学事实证据源。数据截至 2026-07-28。
# 字段：id / question / audience / teaching_point

version: "v1"
aircraft: "c919"
content_nature: "teaching_organization"
qa_seeds:
  - id: "ecs-qa-001-cabin-pressure-altitude"
    question: "C919 客舱里的气压相当于在多高的山上？"
    audience: "普通公众/中学生"
    teaching_point: "C919 巡航时客舱压力高度约 8000 英尺（2400 米），相当于在海拔 2400 米的山上。虽然飞机实际在约 39000 英尺高空飞，但增压系统把客舱气压维持在约 0.75 atm。部分新机型（如 B787）降至 6000 英尺提升舒适度。"

  - id: "ecs-qa-002-oxygen-mask"
    question: "C919 氧气面罩什么时候会掉下来？"
    audience: "普通公众"
    teaching_point: "客舱压力高度超过约 14000 英尺时自动落下，或由飞行员手动释放。面罩拉下后触发化学氧发生器，供氧约 12-15 分钟——足够飞机降到 10000 英尺安全高度。驾驶舱机组用高压氧气瓶供氧更久。"

  - id: "ecs-qa-003-cabin-air-quality"
    question: "C919 客舱空气新鲜吗？会传染病毒吗？"
    audience: "普通公众/有专业兴趣的公众"
    teaching_point: "客舱空气每 2-3 分钟整体更换，约 50% 外部新鲜空气 + 50% HEPA 过滤再循环空气。HEPA 滤除 99.97% 的 0.3 微米颗粒（含细菌病毒）。气流从天花板到地板（非前后流动），降低交叉感染。比办公室、地铁空气更新更快。"

  - id: "ecs-qa-004-temperature"
    question: "C919 客舱温度怎么控制？"
    audience: "普通公众"
    teaching_point: "空调组件（Pack）把发动机/APU 引气降温除压后供入客舱，温度可分区调节（通常 18-24℃）。引气经热交换器用外界冲压空气冷却、空气循环机降温、水分离器除湿。客舱温度由空调系统自动控制，飞行员可设定目标温度。"

  - id: "ecs-qa-005-dry-air"
    question: "为什么坐 C919 飞机觉得口干？"
    audience: "普通公众"
    teaching_point: "巡航高度外界空气温度约 -56℃、湿度极低（<5%），引气进入客舱后湿度仍很低（约 10-20%，舒适湿度约 40-60%）。这是高空飞行的物理结果不是故意干燥。过干会导致口干眼涩疲劳，部分新机有增湿系统但增加重量和冷凝水风险。"

  - id: "ecs-qa-006-bleed-air"
    question: "C919 空调用的是发动机废气吗？"
    audience: "普通公众/中学生"
    teaching_point: "不是废气。引气取自发动机压气机级间（燃烧室之前），是纯净压缩空气未接触燃烧产物。经预冷器降温、空调组件调温调压后供入客舱。引气可能含微量滑油蒸汽（轴承封严），但有过滤和监测。取气点在燃烧室前不是排气管。"

  - id: "ecs-qa-007-ear-discomfort"
    question: "坐 C919 降落时耳朵疼怎么办？"
    audience: "普通公众"
    teaching_point: "耳朵不适是客舱压力变化导致鼓膜内外压差，属正常生理反应。吞咽、打哈欠、捏鼻鼓气可平衡中耳压力。C919 增压系统按 CCAR-25.841 设计，压力变化率限制在旅客可承受范围（通常不超过 500 英尺/分钟）。与飞行员操作无关。"

  - id: "ecs-qa-008-pack-system"
    question: "C919 空调和家用空调有什么区别？"
    audience: "中学生/有专业兴趣的公众"
    teaching_point: "飞机空调组件（Pack）功能远超家用：调温、调压、除湿、供氧一体。包含热交换器（用外界冲压空气冷却）、空气循环机（涡轮-压气机-风扇同轴）、水分离器。需在高空低压低温环境可靠工作，一套 Pack 处理能力远超家用空调。"
