# C919 材料专项误解与纠偏
# 来源说明：本文件基于 01_science 已收集的 C919 公开事实派生，用于教学组织（teaching_organization），不作为科学事实证据源。数据截至 2026-07-28。
# 字段：id / misconception / correction / explanation

version: "v1"
aircraft: "c919"
content_nature: "teaching_organization"
misconceptions:
  - id: "mat-mis-001-composite-is-plastic"
    misconception: "复合材料就是塑料。"
    correction: "航空复合材料主要是碳纤维增强聚合物，强度高于钢、重量约为铝合金的 60%。"
    explanation: >
      日常说的"塑料"是单纯的聚合物，强度低。航空复合材料是碳纤维（增强体）+ 树脂（基体）的组合，
      碳纤维承担主要载荷、树脂固定形状，两者协同后比强度远高于钢。C919 复合材料约占 12%，
      用于尾翼、整流罩等部位。它和矿泉水瓶的塑料是完全不同的材料，把复合材料说成"塑料"会严重低估其力学性能。

  - id: "mat-mis-002-composite-percentage-weight"
    misconception: "C919 复合材料占 12% 是按重量算的，所以实际用得很少。"
    correction: "12% 是按结构重量比例，复合材料主要用于尾翼、整流罩等关键部位，不是"用得很少"。"
    explanation: >
      C919 复合材料占约 12%（按结构重量），看似比例不高，但用于尾翼主结构、整流罩、翼尖小翼等关键部位。
      这些部位用复合材料减重明显、形状复杂可一体化成型。12% 是工程权衡的结果——在减重、成本、可维修性之间平衡，
      不是"用得很少"。B787 复合材料占 50% 是更激进的方案，但 B787 比 C919 晚研制多年，技术成熟度更高。

  - id: "mat-mis-003-aluminum-lithium-rare-earth"
    misconception: "铝锂合金是加了稀土元素的铝合金。"
    correction: "铝锂合金是加了锂元素（不是稀土）的铝合金，锂比铝轻，每加 1% 锂减重约 3%。"
    explanation: >
      铝锂合金是在铝合金中加入锂元素（Lithium），不是稀土元素。锂比铝轻（密度约 0.53 g/cm³，铝约 2.7 g/cm³），
      每加 1% 锂减重约 3%、提高刚度约 5%。C919 铝锂合金占约 8.8%，用于机身蒙皮。把锂说成"稀土"
      是混淆了化学元素分类，锂是碱金属，不是稀土（镧系+钪+钇）。

  - id: "mat-mis-004-composite-invisible-damage"
    misconception: "复合材料损伤肉眼看不见，所以不安全。"
    correction: "复合材料内部损伤需超声/X 射线检测，但通过定期无损检测和损伤容限设计保证安全。"
    explanation: >
      复合材料内部损伤（如分层、脱粘）肉眼看不见，需超声/X 射线检测。但这不等于"不安全"。
      C919 按 CCAR-25.571 损伤容限设计，假设存在初始损伤，验证在两次检查之间裂纹不会扩展到临界尺寸。
      通过定期无损检测（NDI）发现损伤，及时修理。把"损伤看不见"等同于"不安全"是忽略了检测体系和损伤容限设计。

  - id: "mat-mis-005-composite-lightning-strike"
    misconception: "复合材料不导电，遇雷击会爆炸。"
    correction: "复合材料件表面有金属网/铜箔防雷击层，按 CCAR-25.581 验证雷击防护。"
    explanation: >
      碳纤维复合材料本身导电性差，但 C919 复合材料件表面有金属网/铜箔防雷击层，提供雷击电流通路。
      按 CCAR-25.581 雷击防护验证，保证雷击不引起结构破坏、燃油蒸汽点燃、电气系统失效。
      把"复合材料不导电"等同于"遇雷击会爆炸"是忽略了防雷击设计。

  - id: "mat-mis-006-composite-cannot-repair"
    misconception: "复合材料损坏了不能修理，只能换整件。"
    correction: "复合材料可现场修理（螺栓修补/胶接修补/铺层热压），但需专门培训和工艺控制。"
    explanation: >
      复合材料损坏可修理，主要方法：螺栓修补（金属补片螺栓固定）、胶接修补（预浸料胶接）、铺层热压（现场铺层+真空袋固化）。
      但修理需专门培训人员、严格温度/压力控制、按 SRM（结构修理手册）操作。不像金属可以简单铆接，
      但绝不是"不能修理"。C919 维修体系包含复合材料修理能力。

  - id: "mat-mis-007-titanium-too-expensive"
    misconception: "钛合金太贵，C919 不该用。"
    correction: "钛合金用于关键受力部位（起落架/发动机吊架），其性能不可替代，是"少而精"的必要选择。"
    explanation: >
      钛合金成本高（约铝合金 5-10 倍），但强度高、耐高温、抗腐蚀，在发动机吊架、起落架主结构等关键部位不可替代。
      C919 钛合金占约 7%，是"少而精"地用于最关键的部位。把"贵"等同于"不该用"是忽略了性能不可替代性。
      飞机设计是在性能、重量、成本之间权衡，不是单纯追求便宜。

  - id: "mat-mis-008-composite-recyclable"
    misconception: "复合材料是环保材料，可以完全回收。"
    correction: "碳纤维复合材料回收困难，目前主要回收方法是热解/溶剂法，回收纤维性能下降。"
    explanation: >
      碳纤维复合材料回收困难——树脂基体无法像金属那样熔炼回收。目前主要回收方法：热解法（高温烧掉树脂回收碳纤维）、
      溶剂法（化学溶解树脂）。回收碳纤维性能通常下降 10-30%，难以再次用于航空主结构。
      把复合材料说成"完全可回收环保材料"是不准确的，航空业正在研究更好的回收方案。
