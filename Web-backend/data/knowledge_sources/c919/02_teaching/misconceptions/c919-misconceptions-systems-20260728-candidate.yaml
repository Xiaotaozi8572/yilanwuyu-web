# C919 系统专项误解与纠偏
# 来源说明：本文件基于 01_science 已收集的 C919 公开事实派生，用于教学组织（teaching_organization），不作为科学事实证据源。数据截至 2026-07-28。
# 字段：id / misconception / correction / explanation

version: "v1"
aircraft: "c919"
content_nature: "teaching_organization"
misconceptions:
  - id: "sys-mis-001-supercritical-supersonic"
    misconception: "超临界机翼是给超音速飞机用的。"
    correction: "超临界机翼用于跨声速巡航（Mach 0.7-0.9），目的是减小跨声速激波阻力，不是用于超音速飞行。"
    explanation: >
      “超临界”指的是机翼能在接近声速的跨声速区高效工作，而非“超过临界速度”。C919 巡航 Mach 0.785 处于跨声速范围，
      机翼上表面局部气流可能超过声速形成激波。超临界机翼上表面平坦，延缓激波、降低波阻，气动效率提升约 20%、阻力降低约 8%。
      超音速飞机（如协和）用的是三角翼等完全不同的气动布局。

  - id: "sys-mis-002-bypass-more-thrust"
    misconception: "涵道比越大，发动机推力越大。"
    correction: "涵道比大意味着推进效率高、油耗低，但推力响应变慢，且推力大小还取决于风扇直径和核心机功率。"
    explanation: >
      涵道比是外涵道与内涵道空气流量之比，影响的是推进效率而非推力本身。高涵道比把更多空气以较低速度加速，
      推进效率更高、更省油。但大风扇惯量大，推力响应变慢，且发动机直径增大受离地间隙限制。
      LEAP-1C 涵道比约 11:1，标准型推力 129.98 kN、延程型 137.14 kN——推力由发动机整体设计决定，不是涵道比单一决定的。

  - id: "sys-mis-003-fbw-autoflight"
    misconception: "电传操纵就是自动飞行。"
    correction: "电传操纵是操纵信号的传输方式（电信号替代机械钢索），飞行员仍是主动操纵者，不等于自动驾驶。"
    explanation: >
      电传操纵（Fly-By-Wire）解决“飞行员指令如何传到舵面”——侧杆产生电信号，经飞控计算机处理后驱动舵面。
      飞行员仍是主动操纵者。电传可叠加包线保护（失速保护、过载限制）和自动配平，也能与自动驾驶仪对接，
      但电传本身只是操纵通道。C919 采用全权限数字式电传飞控、四余度架构，但不意味着飞机会自己飞。

  - id: "sys-mis-004-apu-backup-engine"
    misconception: "APU 是备用发动机，能在主发动机失效时提供推力。"
    correction: "APU 是辅助动力装置，只提供电力和压缩空气，不产生推力。"
    explanation: >
      APU（Auxiliary Power Unit）装在飞机尾部，本质是一台小型燃气涡轮，但它的输出是电力和压缩空气，
      而非推力。它的作用是在地面主发动机关闭时供电供气（空调、照明、启动主发动机），
      在空中主发动机故障时可应急供电供气，但不能推飞机前进。把它叫“备用发动机”是把“动力”和“推力”混淆了。

  - id: "sys-mis-005-composite-is-plastic"
    misconception: "复合材料就是塑料。"
    correction: "航空复合材料主要是碳纤维增强聚合物，强度高于钢、重量约为铝合金的 60%。"
    explanation: >
      日常说的“塑料”是单纯的聚合物，强度低。航空复合材料是碳纤维（增强体）+ 树脂（基体）的组合，
      碳纤维承担主要载荷、树脂固定形状，两者协同后比强度远高于钢。C919 复合材料约占 12%，
      用于尾翼、整流罩等部位。它和矿泉水瓶的塑料是完全不同的材料，把复合材料说成“塑料”会严重低估其力学性能。

  - id: "sys-mis-006-winglet-decoration"
    misconception: "翼尖小翼只是装饰，没什么实际作用。"
    correction: "翼尖小翼可降低诱导阻力约 3-5%，对一架每天飞多航段的客机年省燃油非常可观。"
    explanation: >
      翼尖小翼削弱机翼下方高压空气在翼尖向上翻卷形成的涡流，降低诱导阻力。C919 融合式翼尖小翼使翼展从 33.6 米增至 35.8 米，
      降低诱导阻力约 3-5%。看似几个百分点，对一架日飞几航段、年飞数千小时的客机，节省的燃油和排放非常可观。
      它是受机场机位翼展限制下“挤出”气动收益的有效手段，绝非装饰。

  - id: "sys-mis-007-ins-no-gps"
    misconception: "惯性导航不需要 GPS，能自己一直准确定位。"
    correction: "惯性导航存在随时间累积的漂移误差，需 GPS/北斗等定期校正。"
    explanation: >
      惯性导航系统（INS）靠陀螺仪和加速度计感知运动并积分计算位置，不依赖外部信号，抗干扰强——这是它的优势。
      但陀螺仪有漂移、加速度计有零偏，积分后误差随时间累积（典型漂移约 1-2 海里/小时）。
      因此实际应用中惯导需 GPS/北斗定期校正，构成“组合导航”。C919 采用惯导+卫星导航多源融合，而非纯惯导。

  - id: "sys-mis-008-aircraft-tire-car-tire"
    misconception: "飞机轮胎和汽车轮胎差不多。"
    correction: "航空轮胎需承受着陆冲击、高压（约 200 psi）和高温，结构与汽车轮胎完全不同。"
    explanation: >
      航空轮胎要承受飞机着陆瞬间数倍于自重的冲击、高速滑跑的摩擦高温、以及约 14 个大气压的充气压力（汽车轮胎约 2-3 个大气压）。
      航空轮胎采用多层帘布结构、特种橡胶配方、充氮气（防燃防爆），并需通过动态冲击试验认证。
      把飞机轮胎等同于汽车轮胎，是低估了其工况的严苛程度。
