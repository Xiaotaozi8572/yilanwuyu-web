# C919 飞控专项误解与纠偏
# 来源说明：本文件基于 01_science 已收集的 C919 公开事实派生，用于教学组织（teaching_organization），不作为科学事实证据源。数据截至 2026-07-28。
# 字段：id / misconception / correction / explanation

version: "v1"
aircraft: "c919"
content_nature: "teaching_organization"
misconceptions:
  - id: "fc-mis-001-fbw-autopilot"
    misconception: "电传操纵就是自动驾驶，飞行员不用管了。"
    correction: "电传是操纵信号的传输方式（电信号替代机械钢索），飞行员仍是主动操纵者，不等于自动驾驶。"
    explanation: >
      电传操纵（Fly-By-Wire）解决"飞行员指令如何传到舵面"——侧杆产生电信号，经飞控计算机处理后驱动舵面。
      飞行员仍是主动操纵者。电传可叠加包线保护（失速保护、过载限制）和自动配平，也能与自动驾驶仪对接，
      但电传本身只是操纵通道。C919 采用全权限数字式电传飞控、四余度架构，但不意味着飞机会自己飞。

  - id: "fc-mis-002-mechanical-backup-obsolete"
    misconception: "电传飞机没有机械备份，一旦断电就完全失控。"
    correction: "C919 电传飞控采用四余度架构和多源供电，单点故障不影响操纵；降级模式下仍有安全操纵能力。"
    explanation: >
      C919 电传飞控采用四余度架构——4 套独立计算机并行工作，像四人表决，少数服从多数。任意一套故障被其余识别隔离。
      飞控计算机由多源供电（主电源、应急发电机、蓄电池），并非单一电源。
      即使多套系统降级，飞控会从正常控制律逐步降级到直接控制律（Direct Law），飞行员仍能直接操纵舵面，
      只是包线保护功能丧失。民机电传飞控不是"断电即失控"的设计。

  - id: "fc-mis-003-envelope-protection-always"
    misconception: "有了包线保护，飞机就不会出事了。"
    correction: "包线保护在正常控制律下生效，系统降级到直接控制律时保护功能丧失，飞行员仍需具备手动操纵能力。"
    explanation: >
      包线保护（失速保护、过载限制、速度限制）是正常控制律（Normal Law）下的功能。
      当系统检测到多重故障降级到备用控制律或直接控制律时，包线保护功能会逐步丧失或完全丧失。
      此时飞行员需依靠自身判断避免超出飞行包线。这也是为什么飞行员训练中仍包含失速改出、大仰角改出等
      手动操纵科目——包线保护是"兜底"而非"替代飞行员"。

  - id: "fc-mis-004-side-stick-vs-yoke"
    misconception: "侧杆操纵不如传统驾驶盘手感好、不安全。"
    correction: "侧杆是电传操纵的人机接口，手感反馈由载荷机构模拟，不影响安全性，且释放了驾驶舱空间。"
    explanation: >
      传统驾驶盘靠机械钢索传递力和位移，飞行员能"感受"气动载荷。侧杆（Side Stick）是电传操纵的人机接口，
      飞行员的操纵指令转为电信号传给飞控计算机，手感由内置载荷弹簧机构模拟。
      C919 采用侧杆设计，与空客 A320 系列类似。侧杆的优点是精准、轻便、释放驾驶舱空间，
      缺点是缺乏力反馈（飞行员无法直接感受气动载荷），但飞控计算机的包线保护和人工感力模拟弥补了这一不足。
      侧杆不比传统驾驶盘更不安全——A320 系列已用侧杆安全飞行数十年。

  - id: "fc-mis-005-quad-redundancy-overkill"
    misconception: "四余度是过度设计，双余度就够了。"
    correction: "四余度是民机电传飞控的安全冗余标准，确保在极端故障场景下仍有安全操纵能力。"
    explanation: >
      民机电传飞控的余度设计需满足 CCAR-25.1309 的安全性要求。四余度架构意味着 4 套独立系统并行工作，
      任意 2 套故障仍能继续安全飞行（fail-operational/fail-safe）。双余度在单点故障后即降级到 fail-safe，
      安全裕度不足。考虑到飞控是飞行安全的核心系统，四余度是行业通行做法（A320 也是四余度或三余度+备分），
      不是过度设计。

  - id: "fc-mis-006-trim-automatic"
    misconception: "电传飞机不需要配平，飞控自动搞定。"
    correction: "电传飞控在正常控制律下可自动配平，但飞行员仍需理解配平原理并在降级模式下手动配平。"
    explanation: >
      C919 电传飞控在正常控制律下提供自动配平功能，飞行员操纵侧杆后松手，飞控计算机会自动调整水平安定面
      保持当前姿态。但这不意味着"配平"概念消失了——在降级控制律下，飞行员需手动配平；
      起飞前也需按载重平衡设置起飞配平。把电传等同于"不用配平"会误导对飞行操纵原理的理解。

  - id: "fc-mis-007-fbw-hackers"
    misconception: "电传飞控会被黑客远程入侵控制飞机。"
    correction: "C919 飞控系统是封闭的独立网络，不与互联网连接，不存在远程入侵路径。"
    explanation: >
      C919 的飞控系统（AFCCS）是封闭的独立网络，飞控计算机、作动器控制单元之间用专用总线（ARINC 429 等）通信，
      不与客舱娱乐系统、互联网或外部网络物理连接。飞控指令来自侧杆、脚踏板和飞控计算机内部算法，
      不接受外部无线或网络输入。"黑客远程控制飞机"是影视剧情节，现实民机飞控系统的网络隔离设计
      从架构上排除了远程入侵路径。适航审定（CCAR-25.1309）也要求验证系统安全性。

  - id: "fc-mis-008-computer-overrides-pilot"
    misconception: "电传飞控计算机会覆盖飞行员的操纵，飞行员说了不算。"
    correction: "正常控制律下飞控会限制超出包线的指令，但飞行员始终是最终决策者，可降级到直接控制律获得全权限。"
    explanation: >
      在正常控制律下，飞控计算机确实会对飞行员的指令进行"过滤"——例如限制迎角不超过失速迎角、
      限制过载不超过结构极限。这叫"包线保护"，目的是防止飞行员无意中把飞机飞出安全范围。
      但飞行员始终是最终决策者：若需获得全权限（如紧急情况需突破包线），系统可降级到直接控制律，
      此时飞行员的指令直接传到舵面，不再受限。包线保护是"安全护栏"而非"剥夺操纵权"。
