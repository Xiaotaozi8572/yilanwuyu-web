# C919 常见误解与纠偏
# 来源说明：本文件基于 01_science 已收集的 C919 公开事实派生，用于教学组织（teaching_organization），不作为科学事实证据源。数据截至 2026-07-28。
# 字段：id / misconception / correction / explanation

version: "v1"
aircraft: "c919"
content_nature: "teaching_organization"
misconceptions:
  - id: "mis-001-fully-domestic"
    misconception: "C919 是完全国产的，所有零件都是中国造的。"
    correction: "C919 是'自主设计、全球供应链集成'的国产大飞机，并非完全国产。"
    explanation: >
      C919 采用国际通行的"主制造商-供应商"模式：中国商飞负责总体设计、系统集成和总装，
      机体结构 100% 国产；但核心系统由国际供应商提供或合资企业生产——发动机为 CFM 国际（美法合资）的 LEAP-1C，
      航电由中美合资昂际航电提供，飞控由中美合资鸿飞飞控提供。按价值量计算国产化率约 60%。
      全球化供应链是航空制造业常态（波音 787 机翼在日本制造、空客 A320 机翼在英国制造）。

  - id: "mis-002-copied-a320"
    misconception: "C919 只是抄了空客 A320。"
    correction: "C919 的气动外形、总体设计和系统集成由中方自主完成，并非抄袭。"
    explanation: >
      C919 与 A320 同属 150-190 座级窄体客机，外观相似是因为同类用途决定了相似的设计约束，
      但 C919 的气动外形、机翼设计、机体结构布局、飞控控制律软件、试飞验证和总装制造均由中国商飞主导完成。
      C919 在某些设计上还有"后发优势"，例如整体式反推短舱是全球窄体客机的首创。
      现代大型客机的核心竞争力在总体设计与系统集成能力，而非单个零件谁造。

  - id: "mis-003-more-composite-better"
    misconception: "复合材料用得越多越好。"
    correction: "复合材料占比需在减重、成本、可维修性之间平衡，并非越多越好。"
    explanation: >
      复合材料比铝合金轻、强度高，但也有代价：成本高、损伤检测难（内部脱层肉眼看不见）、
      修理工艺复杂、回收困难。C919 复合材料占比约 12%，主要用于尾翼、整流罩等非主承力部件；
      中央翼盒原计划用复合材料，为降低设计与认证风险最终改回铝合金。
      工程设计是在减重收益与成本/风险之间做权衡，不是单纯堆材料比例。

  - id: "mis-004-fbw-is-autopilot"
    misconception: "电传操纵就是自动飞行。"
    correction: "电传操纵是一种操纵方式（用电信号替代机械钢索），不等于自动驾驶。"
    explanation: >
      电传操纵（Fly-By-Wire）解决的是"飞行员的指令如何传到舵面"——侧杆产生电信号，
      经飞控计算机处理后驱动舵面。飞行员仍是主动操纵者。电传飞控可以叠加包线保护（失速保护、过载限制）
      和自动配平等辅助功能，也能与自动驾驶仪对接，但电传本身只是操纵通道。
      C919 采用全权限数字式电传飞控、四余度架构，但不等于飞机自己飞。

  - id: "mis-005-higher-bypass-better"
    misconception: "涵道比越大越好。"
    correction: "涵道比需在燃油效率与推力响应、发动机尺寸之间平衡。"
    explanation: >
      高涵道比省油、噪声低，适合长时间巡航，是当代民航发动机的主流方向。但涵道比过大会带来：
      发动机直径增大（影响离地间隙、增加短舱阻力）、推力响应变慢（大风扇惯量大）、
      低速大推力性能受限。C919 的 LEAP-1C 涵道比约 11:1，是与 A320neo、B737 MAX 同代发动机的工程平衡选择。

  - id: "mis-006-engine-domestic"
    misconception: "C919 的发动机是国产的。"
    correction: "C919 当前使用 CFM 国际 LEAP-1C（美法合资），国产 CJ-1000A 仍在研制中。"
    explanation: >
      C919 当前批产型装配的是 CFM 国际（GE 与赛峰合资）的 LEAP-1C 发动机。
      国产替代发动机 CJ-1000A 正在研制，预计 2027-2028 年取证。
      全球民用大飞机发动机供应商主要集中在 GE、罗罗、普惠三家，空客和波音也全部依赖它们，
      选用成熟可靠的 LEAP 发动机是通行商业选择，同时研制 CJ-1000A 是"两条腿走路"的策略。

  - id: "mis-007-certification-infallible"
    misconception: "拿到适航证就等于万无一失。"
    correction: "适航取证是安全门槛，持续适航才是长期保障。"
    explanation: >
      型号合格证证明设计满足安全标准，是"准入门槛"，不是"终身保险"。
      新机型投入运营后会经历"早期成熟期"，出现设计优化和工程改进是正常过程
      （A320neo 投运后也遇过发动机耐久性问题）。运营中还要靠持续适航体系——
      维修、监控、改装、服务通告等——长期保持安全水平。C919 截至 2026 年 5 月安全飞行超 20 万小时，
      但持续适航是贯穿机队全寿命的长期工作。

  - id: "mis-008-same-as-737max-tech-level"
    misconception: "C919 和波音 737 MAX 是完全一样的新技术水平。"
    correction: "C919 与 737 MAX 同代但有代差与各自工程选择，不能简单画等号。"
    explanation: >
      C919（2017 首飞）与 A320neo（2014 首飞）、B737 MAX（2016 首飞）同属新一代窄体客机，
      都用 LEAP 系列发动机。但 C919 是全新设计、全权限电传飞控；
      737 MAX 是在 737 老平台上叠加部分电传功能（MCAS 系统曾出问题）。
      另一方面，737 MAX 已积累超过 7 年运营数据，C919 的运营经验仍在初期积累。
      "同代"不等于"同等技术水平"，更不等于"同等成熟度"。

  - id: "mis-009-no-faa-cannot-fly"
    misconception: "C919 没有 FAA/EASA 认证就不能飞。"
    correction: "C919 已获 CAAC 型号合格证，可在中国境内及与 CAAC 有双边协议的国家运营。"
    explanation: >
      适航认证按国家/地区管辖权运作。C919 已获中国民航局（CAAC）型号合格证，
      可在中国境内运营，并可在与 CAAC 有双边适航协议的 30 多个国家/地区运行。
      FAA/EASA 认可有助于进入更广泛的国际市场，但不是"飞行本身"的前提条件。
      国际航线运营还需起降国民航当局的认可。

  - id: "mis-010-just-assembly"
    misconception: "C919 只是把国外零件买来拼在一起，中国只做组装。"
    correction: "C919 的总体设计、系统集成、试飞验证和总装制造均由中方主导。"
    explanation: >
      现代大型客机的核心竞争力不在单个零件谁造，而在总体设计能力和系统集成能力。
      C919 的气动外形、结构布局、飞控控制律软件、试飞验证、总装制造和适航取证全部由中国商飞主导。
      把来自全球数百家供应商的数百万个零件集成成一个安全、可靠、经济的飞行平台并取得适航批准，
      本身就是最高水平的工程能力体现。
