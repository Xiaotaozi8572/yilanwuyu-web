# C919 电气专项误解与纠偏
# 来源说明：本文件基于 01_science 已收集的 C919 公开事实派生，用于教学组织（teaching_organization），不作为科学事实证据源。数据截至 2026-07-28。
# 字段：id / misconception / correction / explanation

version: "v1"
aircraft: "c919"
content_nature: "teaching_organization"
misconceptions:
  - id: "elec-mis-001-230v-dangerous"
    misconception: "飞机用 230V 交流电比家用 220V 更危险，容易触电。"
    correction: "飞机电气系统有严格的绝缘、隔离和接地保护，电压等级与安全性不直接等同，230V AC 是航空标准等级。"
    explanation: >
      C919 主交流电源为 230V AC（变频，360-800 Hz），高于传统 115V AC。
      电压等级选择是减重与效率的工程权衡——更高电压意味着同等功率下电流更小，线缆更细、重量更轻。
      飞机电气系统有严格的绝缘耐压设计、GFI（接地故障保护）、差动保护等，且线缆走线在专门线束通道，
      乘客和机组无法直接接触。把"230V"等同于"更危险"是用家用触电经验套用航空电气设计，
      忽略了飞机电气系统的多层安全保护。

  - id: "elec-mis-002-battery-like-car"
    misconception: "飞机蓄电池和汽车电瓶一样，启动发动机用。"
    correction: "飞机蓄电池是航空级镍镉或锂电池，用于应急供电，不是用来启动发动机的。"
    explanation: >
      C919 主发动机启动由 APU 引气驱动的空气启动机完成，不需要蓄电池直接启动发动机。
      飞机蓄电池的作用是在所有主电源失效时，为关键航电和飞控提供应急电力（约 30-60 分钟），
      确保飞机能安全降落。C919 采用航空级蓄电池（镍镉或锂离子），需满足 CCAR-25.1353 的防火、
      防爆、低温性能要求。把飞机蓄电池等同于"汽车电瓶"是低估了其在应急供电中的关键作用和技术要求。

  - id: "elec-mis-003-apu-generator-only"
    misconception: "APU 只是个发电机，和地面电源车一样。"
    correction: "APU 同时提供电力和压缩空气，且能在空中工作，不只是地面电源。"
    explanation: >
      APU（辅助动力装置）是装在飞机尾部的小型燃气涡轮，输出有两路：电力（APU 发电机）和压缩空气（引气）。
      地面时，APU 可在无地面电源车的情况下供电供气，启动主发动机、开空调、照明。
      空中主发动机故障时，APU 可应急供电供气，维持飞控、航电和客舱环境。
      把 APU 等同于"地面电源车"是忽略了它的双输出（电+气）和空中应急能力。

  - id: "elec-mis-004-no-need-ground-power"
    misconception: "飞机靠自身发电就行，停靠时不需要外接电源。"
    correction: "飞机停靠时主发动机关闭、APU 也常为节油降噪而关闭，需外接地面电源和空调供客舱使用。"
    explanation: >
      飞机停靠廊桥或远机位时，主发动机关闭（省油、防异物损伤），APU 也常被关闭以降低噪声和排放。
      此时需外接地面电源（GPU, Ground Power Unit，400 Hz 115V AC）为客舱照明、空调、航电供电，
      或通过廊桥的 400 Hz 电源接口供电。地面空调车直接为客舱供冷暖气。把飞机停靠看作"自给自足"
      是忽略了地面保障设备的作用——外接电源是航班地面过站的标准操作。

  - id: "elec-mis-005-ram-air-turbine-propulsion"
    misconception: "RAT（冲压空气涡轮）是备用发动机，能提供推力。"
    correction: "RAT 是应急动力源，靠气流驱动涡轮发电和驱动液压泵，不产生推力。"
    explanation: >
      RAT（Ram Air Turbine）是装在机身或机腹的可收放小涡轮。当所有主电源失效时，RAT 自动放出，
      靠飞机前进的气流驱动涡轮旋转，带动发电机和液压泵，为飞控和关键航电提供最低限度的电力和液压。
      RAT 不产生推力，不帮飞机前进——它只是"应急充电宝+应急液压泵"。
      著名的"吉姆滑翔机"事件（Air Transat 236 航班，2001 年）就是 RAT 发挥作用的典型案例。

  - id: "elec-mis-006-constant-frequency"
    misconception: "飞机发电和家用一样是恒定 50Hz/60Hz 交流电。"
    correction: "C919 采用变频交流电（360-800 Hz）和直流电混合架构，不同于家用的恒频 50Hz。"
    explanation: >
      传统客机用恒频交流电（400 Hz），通过 IDG（集成驱动发电机）把发动机变化的转速转为恒定 400Hz 输出。
      C919 采用变频架构（VF, Variable Frequency），发电机直接输出随发动机转速变化的交流电（约 360-800 Hz），
      省去了沉重的恒速传动装置（CSD），减轻重量。变频电不能直接用于对频率敏感的设备（如某些电机），
      需通过变压整流器（TRU）转为直流电或逆变器转为恒频交流电。这是"多电飞机"（More-Electric Aircraft）
      的趋势，用电力电子替代机械液压。

  - id: "elec-mis-007-wiring-just-cables"
    misconception: "飞机线缆和家用电线一样，能导电就行。"
    correction: "航空线缆需满足阻燃、低烟、耐高温、耐振动、重量轻等严格要求，材料和结构与家用电线完全不同。"
    explanation: >
      C919 全机线缆总长达数十公里，每根线缆都需满足 CCAR-25.1355 和相关材料标准。
      航空线缆采用镀银铜或铝合金导体、聚四氟乙烯（PTFE）或聚酰亚胺绝缘，要求阻燃、低烟无毒（燃烧不释放氰化氢）、
      耐高温（200℃以上）、耐振动和潮湿。线束走线需考虑电磁兼容（EMC），避免信号干扰。
      一架飞机的线缆重量可达数百公斤甚至上吨，是减重设计的重要对象。把飞机线缆等同于"家用电线"
      是低估了其材料、工艺和安全要求。

  - id: "elec-mis-008-emp-immune"
    misconception: "飞机电气系统会受雷电和电磁脉冲影响，飞行不安全。"
    correction: "C919 按 CCAR-25.581 设计雷电防护和电磁兼容（EMC），可承受雷击后持续安全飞行。"
    explanation: >
      民机平均每年被雷击约 1-2 次，但飞机按 CCAR-25.581 设计了雷电防护：机身蒙皮作为法拉第笼引导雷电流
      沿外表面流过（不进入客舱）、燃油系统有防雷击设计、电气系统有浪涌保护和电磁屏蔽。
      C919 通过了雷电全机试验和电磁兼容试验，验证雷击后电气系统不中断、不误动作。
      把"飞机怕雷击"等同于"飞行不安全"是用日常电器经验套用航空标准——民机雷电防护是成熟技术。
