# C919 液压专项误解与纠偏
# 来源说明：本文件基于 01_science 已收集的 C919 公开事实派生，用于教学组织（teaching_organization），不作为科学事实证据源。数据截至 2026-07-28。
# 字段：id / misconception / correction / explanation

version: "v1"
aircraft: "c919"
content_nature: "teaching_organization"
misconceptions:
  - id: "hyd-mis-001-water-hydraulic"
    misconception: "液压系统里的液体是水。"
    correction: "航空液压系统使用专用液压油（如磷酸酯抗燃油），不是水，因为水会腐蚀、低温结冰、润滑性差。"
    explanation: >
      航空液压系统工作压力高（C919 约 3000 psi/20.7 MPa），液压油需具备耐高温、低温不结冰、抗燃、润滑性好、
      化学稳定等特性。水在 0℃ 以下结冰、会腐蚀金属、润滑性极差，根本不能用作液压介质。
      C919 液压系统使用磷酸酯抗燃液压油（如 Skydrol LD-4），闪点高、抗燃、低温粘度合适。
      把液压油等同于"水"是低估了液压介质的技术要求。

  - id: "hyd-mis-002-3000-psi-dangerous"
    misconception: "3000 psi 的液压系统太危险了，漏一点就爆炸。"
    correction: "液压系统按 CCAR-25 设计，管路有耐压裕度、泄漏探测和隔离阀，泄漏不会引发爆炸。"
    explanation: >
      C919 液压系统工作压力约 3000 psi（20.7 MPa），确实压力很高。但液压管路按 CCAR-25.1435 设计，
      爆破压力是工作压力的数倍（通常 4 倍以上），管路接头经过耐压试验和疲劳试验验证。
      系统配泄漏探测传感器和隔离阀，一旦检测到泄漏可自动隔离故障段。
      液压油喷出是高压泄漏的表现，但不会像炸弹一样爆炸——液压油不可压缩，管路破裂后压力迅速释放。
      把高压液压等同于"会爆炸"是误解了液体不可压缩的物理特性。

  - id: "hyd-mis-003-redundant-overkill"
    misconception: "三套独立液压系统是过度设计，一套就够了。"
    correction: "飞控等关键系统依赖液压驱动，三套独立系统是 CCAR-25.1309 要求的安全冗余，确保多重故障下仍能操纵。"
    explanation: >
      C919 飞控舵面（升降舵、副翼、方向舵等）和起落架、刹车等系统由液压作动器驱动。
      若只有一套液压系统，单点故障即导致飞控失效——这是不可接受的。
      CCAR-25.1309 要求关键系统满足"失效概率低于 10⁻⁹/飞行小时"。
      C919 采用三套独立液压系统（左、右、辅助），每套有独立的泵、油箱、管路，任意一套甚至两套故障，
      剩余系统仍能驱动关键舵面安全飞行和着陆。这是民机安全冗余的通行做法，不是过度设计。

  - id: "hyd-mis-004-electric-replace-hydraulic"
    misconception: "现在都是电传了，液压系统该被淘汰了。"
    correction: "电传改变的是信号传输方式，驱动舵面的力量仍来自液压作动器，液压系统不可替代。"
    explanation: >
      "电传"（Fly-By-Wire）解决的是"飞行员指令如何传到舵面"——用电信号替代机械钢索。
      但电信号到达舵面后，仍需要"力量"来推动舵面偏转——这个力量来自液压作动器。
      飞行员侧杆→电信号→飞控计算机→液压作动器→舵面偏转。液压是"执行机构"，电传是"信号通道"。
      目前有"电液作动器"（EHA）和"机电作动器"（EMA）等新技术在局部替代传统液压，
      但全机替代液压在窄体客机上尚未成熟，C919 仍以集中式液压系统为主。

  - id: "hyd-mis-005-engine-pump-only"
    misconception: "液压泵只有发动机驱动，发动机停了液压就没了。"
    correction: "液压系统有多源驱动：发动机驱动泵（EDP）、电动泵（ACMP）、 RAT 冲压涡轮，确保多重生效。"
    explanation: >
      C919 每套液压系统有多个压力源：发动机驱动泵（EDP，由发动机附件机匣驱动）、交流电动泵（ACMP，由电源系统供电）。
      当主发动机失效时，电动泵可由 APU 或应急发电机供电继续工作。
      若所有动力源失效，还有冲压空气涡轮（RAT）自动放出，靠飞机前进的气流驱动涡轮发电和驱动液压泵，
      提供最低限度的液压压力确保飞控可操纵。把液压等同于"只有发动机泵"是忽略了多源冗余设计。

  - id: "hyd-mis-006-brakes-mechanical"
    misconception: "飞机刹车和汽车一样踩脚踏板机械控制。"
    correction: "C919 刹车由液压系统驱动、电传/液压控制，防滑刹车系统（ABS）防止轮胎打滑。"
    explanation: >
      C919 主起落架有多轮刹车组件，由液压系统驱动刹车活塞。飞行员踩刹车脚踏→电信号→刹车控制单元（BCU）→
      液压阀门→刹车活塞。与汽车机械刹车不同，飞机刹车有防滑系统（类似汽车 ABS 但更复杂），
      防止着陆高速时轮胎抱死打滑。C919 还有自动刹车系统（Auto-Brake），可预设减速率自动刹车。
      把飞机刹车等同于"汽车脚踏板机械刹车"是低估了其液压驱动和防滑控制的复杂性。

  - id: "hyd-mis-007-fluid-never-change"
    misconception: "液压油和机油一样定期换就行，不用监测。"
    correction: "航空液压油需定期检测污染度、水分、酸值等指标，污染会损坏高精度作动器。"
    explanation: >
      航空液压系统对油液清洁度要求极高（通常 ISO 4406 等级严于 NAS 8 级），因为液压作动器有精密伺服阀，
      微小颗粒会划伤阀芯导致内漏或卡滞。维护中需定期取样检测：颗粒污染度、含水量、酸值（水解和氧化产物）、
      电阻率（磷酸酯油绝缘性影响液压马达）。水分超标会加速水解、降低润滑性。
      把液压油等同于"汽车机油定期换"是忽略了航空液压系统对污染控制的严苛要求。

  - id: "hyd-mis-008-accumulator-useless"
    misconception: "蓄压器只是个储油罐，没什么实际作用。"
    correction: "蓄压器储存液压能，在泵失效瞬间补偿压力波动，并为刹车和飞控提供应急液压源。"
    explanation: >
      液压蓄压器（Accumulator）内充氮气，利用气体可压缩性储存液压能。
      当液压泵瞬时流量不足（如大舵面快速偏转）、或泵失效的瞬间，蓄压器释放储存的液压油维持压力，
      防止系统压力骤降导致作动器响应迟滞。刹车蓄压器还提供应急刹车液压源，确保在液压系统失效时仍有几次刹车可用。
      把蓄压器等同于"储油罐"是低估了它在瞬态压力补偿和应急液压中的关键作用。
