# C919 环控专项误解与纠偏
# 来源说明：本文件基于 01_science 已收集的 C919 公开事实派生，用于教学组织（teaching_organization），不作为科学事实证据源。数据截至 2026-07-28。
# 字段：id / misconception / correction / explanation

version: "v1"
aircraft: "c919"
content_nature: "teaching_organization"
misconceptions:
  - id: "ecs-mis-001-oxygen-tanks-only"
    misconception: "客舱氧气来自氧气瓶，用完就没了。"
    correction: "紧急氧气由化学氧发生器提供（约 12-15 分钟），不是单纯靠氧气瓶储存。"
    explanation: >
      客舱紧急氧气面罩落下后，氧气来自座椅上方的化学氧发生器（氯酸盐蜡烛），拉下面罩触发化学反应产生氧气，
      持续约 12-15 分钟——足够飞机从高空降到 10000 英尺安全高度。化学氧发生器比高压氧气瓶更轻、更安全
      （无高压容器爆炸风险），但供氧时间有限。驾驶舱机组氧气是高压氧气瓶（需更长供氧时间）。
      把"客舱氧气"等同于"氧气瓶储存"是误解了化学氧发生器的工作原理。

  - id: "ecs-mis-002-cabin-pressure-balloon"
    misconception: "客舱增压像气球，飞太高就炸。"
    correction: "增压客舱按 CCAR-25.365 设计，有正压/负压安全阀保护，不会像气球一样爆炸。"
    explanation: >
      C919 客舱是增压舱，巡航时内外压差约 0.06-0.07 MPa（客舱压力高度约 8000 英尺/2400 米）。
      机身蒙皮按 CCAR-25.365 增压载荷设计，安全系数 1.5（CCAR-25.303），并通过静力试验验证到极限载荷。
      还配正压释放阀（防超压）和负压释放阀（防负压），压差超限时自动放气保护。
      把增压客舱等同于"气球"是低估了结构设计和安全阀保护——气球是单一薄壁结构，
      飞机增压舱是经过数千次疲劳循环验证的工程结构。

  - id: "ecs-mis-003-cabin-air-stale"
    misconception: "客舱空气不流通，全是别人呼出的废气。"
    correction: "C919 客舱空气每 2-3 分钟整体更换一次，且经过 HEPA 过滤，新鲜空气占比约 50%。"
    explanation: >
      C919 客舱空调系统从发动机或 APU 引气，经过空调组件（Pack）降温除压后供入客舱。
      供气中约 50% 是外部新鲜空气，约 50% 是经过 HEPA（高效颗粒物过滤器）过滤的再循环空气——
      HEPA 可滤除 99.97% 的 0.3 微米颗粒物（包括细菌和病毒）。客舱空气每 2-3 分钟整体更换一次，
      流动方向从天花板到地板（不是前后流动），降低交叉感染风险。
      把客舱等同于"密闭不通风"是误解了现代客机的空气循环系统设计。

  - id: "ecs-mis-004-engine-air-dirty"
    misconception: "空调用发动机引气，所以客舱空气都是发动机废气。"
    correction: "引气取自发动机压气机级间，是纯净压缩空气，不经过燃烧室，不是"发动机废气"。"
    explanation: >
      发动机引气（Bleed Air）取自压气机的中级或高压级，在燃烧室之前——这里的空气只被压缩升温，
      未接触燃油燃烧产物，是纯净的压缩空气。引气经过预冷器降温、空调组件（Pack）调节温度和压力后供入客舱。
      虽然引气可能含微量滑油蒸汽（来自发动机轴承封严），但有过滤和监测系统。
      把"发动机引气"等同于"发动机废气"是误解了引气取气点的位置——它取自燃烧室前，不是排气管。

  - id: "ecs-mis-005-dry-air-purpose"
    misconception: "客舱空气干燥是为了省油。"
    correction: "客舱干燥主要因高空外界空气本身极干（湿度<5%），不是为了省油，且过干会影响舒适度。"
    explanation: >
      巡航高度约 12000 米的外界空气温度约 -56℃、湿度极低（几乎不含水蒸气）。
      引气进入客舱后虽然经过空调组件调节温度，但湿度仍很低（客舱湿度约 10-20%，而舒适湿度约 40-60%）。
      这是高空飞行的物理结果，不是"为了省油故意干燥"。事实上，过干的空气会导致旅客口干、眼涩、疲劳，
      航空公司反而希望提高湿度（部分新机型有增湿系统），但增湿会增加重量和冷凝水风险。
      把"客舱干燥"归因于"省油"是颠倒了因果关系。

  - id: "ecs-mis-006-cabin-altitude-8000ft"
    misconception: "客舱压力高度 8000 英尺意味着飞机飞到了 8000 英尺高。"
    correction: "8000 英尺是客舱内部等效气压对应的海拔高度，飞机实际巡航在约 39000 英尺。"
    explanation: >
      C919 巡航高度约 39000 英尺（12000 米），外界气压约 0.2 atm。增压系统把客舱气压维持在外界约 8000 英尺
      （2400 米）对应的气压（约 0.75 atm）。"客舱压力高度 8000 英尺"是气压等效概念，不是说飞机在 8000 英尺飞。
      这也是为什么乘客感觉"在飞机里和在高山上类似"——客舱气压相当于在 2400 米山上。
      C919 客舱压力高度约 8000 英尺（部分新机型如 B787 降至 6000 英尺以提升舒适度）。

  - id: "ecs-mis-007-pack-simple-ac"
    misconception: "飞机空调和家用空调一样，就是制冷制热。"
    correction: "飞机空调系统（Pack）需调温、调压、除湿、供氧，功能远比家用空调复杂。"
    explanation: >
      C919 空调组件（Pack）的核心功能：把发动机引气（高温高压）降温降压到适合客舱的温度和压力，
      同时控制湿度和流量。Pack 包含热交换器（用外界冲压空气冷却）、空气循环机（涡轮-压气机-风扇同轴）、
      水分离器（除湿）、温度控制阀。一套 Pack 的处理能力远超家用空调，且需在高空低压、低温环境下可靠工作。
      把飞机空调等同于"家用制冷制热"是低估了其在增压、除湿、流量平衡中的多重作用。

  - id: "ecs-mis-008-cabin-pressure-ear"
    misconception: "飞机降落耳朵疼是因为气压升高，飞行员操作不当。"
    correction: "耳朵不适是客舱压力变化导致鼓膜内外压差，属正常生理反应，与飞行员操作无关。"
    explanation: >
      飞机下降时增压系统按程序逐步提高客舱压力（从巡航低压降到着陆时接近地面气压）。
      压力变化过程中，中耳腔内外压差可能使鼓膜内陷或外凸，产生不适——这是人体咽鼓管的生理特性，
      不是"飞行员操作不当"。吞咽、打哈欠、捏鼻鼓气可平衡中耳压力缓解不适。
      C919 增压系统按 CCAR-25.841 设计，压力变化率限制在旅客可承受范围（通常不超过 500 英尺/分钟等效变化率）。
      把耳朵不适归咎于"飞行员操作"是误解了增压系统的自动控制机制。
