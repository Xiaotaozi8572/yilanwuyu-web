# C919 气动专项误解与纠偏
# 来源说明：本文件基于 01_science 已收集的 C919 公开事实派生，用于教学组织（teaching_organization），不作为科学事实证据源。数据截至 2026-07-28。
# 字段：id / misconception / correction / explanation

version: "v1"
aircraft: "c919"
content_nature: "teaching_organization"
misconceptions:
  - id: "aero-mis-001-supercritical-supersonic"
    misconception: "超临界机翼是给超音速飞机用的。"
    correction: "超临界机翼用于跨声速巡航（Mach 0.7-0.9），目的是减小跨声速激波阻力，不是用于超音速飞行。"
    explanation: >
      "超临界"指的是机翼能在接近声速的跨声速区高效工作，而非"超过临界速度"。C919 巡航 Mach 0.785 处于跨声速范围，
      机翼上表面局部气流可能超过声速形成激波。超临界机翼上表面平坦，延缓激波、降低波阻，气动效率提升约 20%、阻力降低约 8%。
      超音速飞机（如协和）用的是三角翼等完全不同的气动布局。

  - id: "aero-mis-002-winglet-decoration"
    misconception: "翼尖小翼只是装饰，没什么实际作用。"
    correction: "翼尖小翼可降低诱导阻力约 3-5%，对一架每天飞多航段的客机年省燃油非常可观。"
    explanation: >
      翼尖小翼削弱机翼下方高压空气在翼尖向上翻卷形成的涡流，降低诱导阻力。C919 融合式翼尖小翼使翼展从 33.6 米增至 35.8 米，
      降低诱导阻力约 3-5%。看似几个百分点，对一架日飞几航段、年飞数千小时的客机，节省的燃油和排放非常可观。
      它是受机场机位翼展限制下"挤出"气动收益的有效手段，绝非装饰。

  - id: "aero-mis-003-bird-flapping-wings"
    misconception: "飞机像鸟扇翅膀一样飞起来。"
    correction: "飞机机翼固定不动，靠气流压力差产生升力，不像鸟扇动翅膀。"
    explanation: >
      这是科普讲解中最常见的错误类比。鸟靠扇动翅膀产生升力和推力，而飞机机翼固定不动，靠飞机向前运动让气流流过机翼，
      上下表面压力差产生升力。C919 机翼完全固定，靠发动机推力让飞机前进，机翼与空气相对运动产生升力。
      把飞机说成"像鸟扇翅膀"会严重误导对升力原理的理解。

  - id: "aero-mis-004-bernoulli-only"
    misconception: "升力完全靠伯努利原理（上快下慢压力差）。"
    correction: "升力是压力差+气流下推动反作用力的综合效果，伯努利原理只是部分解释。"
    explanation: >
      伯努利原理（流速快压力小）解释了机翼上下表面压力差的部分原因，但不是全部。机翼还会把迎面来的空气往下"推"，
      根据牛顿第三定律（作用力与反作用力），空气反过来给机翼一个向上的力，这也是升力的重要部分。
      现代空气动力学用 Navier-Stokes 方程完整描述升力，伯努利+牛顿都是简化解释。

  - id: "aero-mis-005-stall-engine-stop"
    misconception: "失速就是发动机停了，飞机没动力了。"
    correction: "失速是机翼迎角超过临界值导致升力骤降，与发动机是否工作无关。"
    explanation: >
      "失速"（Stall）在航空中指机翼失速，不是发动机停车。当迎角超过临界迎角，机翼上表面气流大面积分离，升力骤降。
      即使发动机全功率工作，飞机仍会失速。C919 电传飞控提供迎角限制（α-protection），把可用迎角限制在失速迎角以下。
      发动机停车叫"engine failure"，不是"stall"。

  - id: "aero-mis-006-mach-1-supersonic"
    misconception: "C919 巡航 Mach 0.785 是亚音速，所以机翼上方气流也是亚音速。"
    correction: "虽然来流 Mach 0.785<1，但机翼上表面局部气流可能超过声速形成激波。"
    explanation: >
      这就是"跨声速"的概念。来流马赫数小于 1，但气流绕机翼上表面加速后，局部流速可能超过声速，形成局部超声速区。
      在该区结尾处气流从超声速减速到亚声速，形成正激波，带来波阻。C919 超临界机翼就是为延迟激波、降低波阻而设计。
      "亚音速飞行"不等于"机翼上方气流全亚音速"。

  - id: "aero-mis-007-sweep-back-faster"
    misconception: "后掠角越大飞得越快。"
    correction: "后掠角提高阻力发散马赫数，但推力不增加；过大后掠角反而降低低速升力和增加结构重量。"
    explanation: >
      后掠翼让有效气流方向相对机翼的法向分量减小，降低机翼上表面局部马赫数，把阻力发散马赫数提高——
      这让飞机能在更高 Mach 数巡航而不遇到激波阻力发散。但后掠角不增加推力，过大后掠角会降低低速升力、增加结构重量、
      燃油容积减小。C919 后掠角是综合权衡的结果，不是"越大越快"。

  - id: "aero-mis-008-aerodynamics-20-percent"
    misconception: "气动效率提升 20% 就是省 20% 的油。"
    correction: "气动效率提升 20% 是升阻比提升，不等于燃油节省 20%；实际燃油节省约 5-15%。"
    explanation: >
      "气动效率提升 20%"通常指升阻比（L/D）提升 20%，意味着同等升力下阻力减小。
      但燃油消耗还取决于发动机油耗、飞机重量、飞行状态等。气动效率 +20% 实际转化为燃油节省约 5-15%
      （视飞行剖面而定）。把"气动效率 +20%"等同于"省油 20%"是混淆概念。
