# C919 燃油专项误解与纠偏
# 来源说明：本文件基于 01_science 已收集的 C919 公开事实派生，用于教学组织（teaching_organization），不作为科学事实证据源。数据截至 2026-07-28。
# 字段：id / misconception / correction / explanation

version: "v1"
aircraft: "c919"
content_nature: "teaching_organization"
misconceptions:
  - id: "fuel-mis-001-tank-location"
    misconception: "飞机燃油装在机身里，就像汽车的油箱。"
    correction: "C919 主要燃油储存在机翼内部油箱，机身仅有中央翼盒辅助油箱，机翼油箱利用结构空间兼作储油。"
    explanation: >
      C919 燃油主要储存在左右机翼内部的结构油箱（Integral Tank），机翼蒙皮和翼梁就是油箱壁。
      这种设计一物多用：机翼结构同时承担气动载荷和储油功能，减轻了单独油箱的重量。
      中央翼盒也有油箱，用于平衡供油。机身一般不设大型油箱（除非远程型加装中央辅助油箱）。
      把飞机燃油等同于"汽车油箱在车身"是忽略了机翼结构油箱的集成设计。

  - id: "fuel-mis-002-any-jet-fuel"
    misconception: "喷气式发动机什么航空煤油都能烧，无所谓型号。"
    correction: "C919 使用 Jet A-1 航空煤油（中国牌号 RP-3），有严格的规格要求，不能随意混用其他燃料。"
    explanation: >
      C919 的 LEAP-1C 涡扇发动机按 Jet A-1（中国 RP-3）航空煤油设计，规格要求密度、闪点、冰点、热稳定性、
      芳烃含量等指标在规定范围。Jet A-1 冰点低于 -47℃，保证高空低温不结冰。
      汽油（Avgas）用于活塞发动机，与涡扇发动机不兼容；柴油热值和粘度不同，也不能直接使用。
      加错燃料会导致发动机熄火、燃油系统损坏，是严重的安全事故。

  - id: "fuel-mis-003-full-tank-range"
    misconception: "飞机油箱加满就能飞最远，加多少油和载客量无关。"
    correction: "飞机起飞重量有限制（MTOW），燃油和载重需在起飞重量范围内权衡，不是"油加满飞最远"。"
    explanation: >
      C919 最大起飞重量约 77.3 吨（标准型）。起飞重量 = 空机重量 + 燃油 + 载客载货。
      空机重约 43 吨，剩余约 34 吨需在燃油和载荷之间分配。短途航班载客多、燃油少；
      长途航班载客少、燃油多。若满客（约 16 吨载荷），燃油只能加约 18 吨，航程受限。
      延程型（ER）增大了最大起飞重量，才能在满客下飞更远。把"加油"和"载客"看作互不影响是
      忽略了起飞重量的刚性约束。

  - id: "fuel-mis-004-gravity-feed"
    misconception: "油箱里的油靠重力流到发动机就行了。"
    correction: "飞机燃油系统有增压泵强制供油，不能仅靠重力，因为高空低压下燃油可能气阻。"
    explanation: >
      C919 燃油系统配多级增压泵（DC 和 AC 泵），强制将燃油从油箱输送到发动机。
      高空飞行时外界气压低（巡航高度约 12000 米，外界气压仅约 0.2 atm），若仅靠重力供油，
      燃油管路中可能因低压形成气泡（气阻），导致供油中断。增压泵维持管路正压，防止气阻。
      此外，飞机姿态变化（俯仰、滚转）也会影响油液分布，仅靠重力无法保证持续供油。
      把飞机燃油等同于"汽车油箱重力供油"是忽略了高空低压环境的技术挑战。

  - id: "fuel-mis-005-center-of-gravity"
    misconception: "燃油消耗不影响飞机重心，加在哪里都一样。"
    correction: "燃油消耗会改变飞机重心位置，C919 有重心管理系统通过供油顺序控制重心在安全范围内。"
    explanation: >
      C919 燃油分布在左右机翼油箱和中央油箱，不同油箱的燃油消耗顺序会影响飞机重心位置。
      燃油管理系统（FGS）按预定顺序消耗各油箱燃油，确保飞行过程中重心始终在允许范围内（CCAR-25.27 限制）。
      若重心超出范围，会影响飞机稳定性和操纵性，严重时导致失控。
      把"加油位置"和"燃油消耗"看作不影响重心，是忽略了燃油分布对飞机平衡的关键作用。

  - id: "fuel-mis-006-inert-gas-useless"
    misconception: "油箱里充惰性气体是多余的，浪费重量。"
    correction: "油箱充氮气（OBIGGS/FTIS）可降低油箱内氧浓度，防止可燃混合气爆炸，是 CCAR-25 安全要求。"
    explanation: >
      航空燃油蒸汽与空气混合后在一定浓度范围内可燃可爆。TWA 800 航班（1996 年）因中央油箱燃油蒸汽爆炸坠毁后，
      FAA 和 CAAC 要求新设计客机降低油箱可燃性。C919 采用油箱惰化系统（FTIS），将分离出的氮气富集气体充入油箱
      上部空间，把氧浓度降到 12% 以下，使燃油蒸汽无法被点燃。这是用少量重量换取油箱防爆安全的关键设计，
      不是"多余"。

  - id: "fuel-mis-007-dump-anytime"
    misconception: "飞机遇到紧急情况随时可以放油。"
    correction: "放油系统有使用条件限制，且 C919 作为窄体客机不一定配备放油系统，紧急降落可用燃油消耗方式减重。"
    explanation: >
      放油系统（Fuel Jettison）主要用于宽体客机（如 A350、B777），因为其最大起飞重量远超最大着陆重量，
      紧急降落前需放油减重至着陆限重以内。C919 作为窄体客机，最大起飞重量与最大着陆重量差距较小
      （MTOW 约 77 吨，MLW 约 66 吨），可通过空中盘旋消耗燃油或溢油方式减重。
      即使配备放油系统，也只在发动机失效、火灾等紧急情况下使用，且需在指定高度和区域执行，
      不能"随时放油"。把放油看作"随时随地可操作"是误解了其使用限制。

  - id: "fuel-mis-008-fuel-gauge-simple"
    misconception: "飞机油量表和汽车一样，看个数字就行。"
    correction: "飞机燃油量测量是多探头电容式系统，需补偿密度和姿态变化，还与重心管理联动，远比汽车油量表复杂。"
    explanation: >
      C919 油箱内有多个电容式油量探头，通过测量燃油和空气介电常数差异计算油量。
      但油量测量需补偿：燃油密度随温度变化（热胀冷缩）、飞机姿态变化导致油液分布改变（俯仰/滚转）、
      高空低压下油液体积膨胀。燃油管理系统综合多探头数据、密度传感器、姿态数据，输出经补偿的总油量和重心位置。
      此外，燃油量还与重心管理、耗油顺序控制联动。把飞机油量表等同于"汽车看个数字"是严重低估了其测量复杂度。
