# C919 结构专项误解与纠偏
# 来源说明：本文件基于 01_science 已收集的 C919 公开事实派生，用于教学组织（teaching_organization），不作为科学事实证据源。数据截至 2026-07-28。
# 字段：id / misconception / correction / explanation

version: "v1"
aircraft: "c919"
content_nature: "teaching_organization"
misconceptions:
  - id: "struct-mis-001-pressure-cabin-balloon-pop"
    misconception: "增压客舱像气球，增压太高会爆。"
    correction: "增压客舱按 CCAR-25.365 设计，有正压/负压安全阀保护，不会像气球一样爆炸。"
    explanation: >
      C919 客舱是增压舱，巡航时内外压差约 0.06-0.07 MPa。机身蒙皮按 CCAR-25.365 增压载荷设计，
      安全系数 1.5（CCAR-25.303），并通过静力试验验证到极限载荷。还配正压释放阀（防超压）和负压释放阀（防负压），
      压差超限时自动放气保护。把增压客舱等同于"气球"是低估了结构设计和安全阀保护。

  - id: "struct-mis-002-fatigue-life-zero"
    misconception: "飞机结构有疲劳寿命，到了就立刻断裂。"
    correction: "疲劳寿命是统计概念，到了寿命需检查/修理/退役，不是立刻断裂。"
    explanation: >
      飞机结构疲劳寿命（如 60,000 起落）是统计概念——在此时点之前裂纹出现的概率很低，之后概率上升。
      到了寿命需进行深度检查、修理或退役，不是"到了就立刻断裂"。C919 按 CCAR-25.571 损伤容限设计，
      假设存在初始裂纹，验证在两次检查之间裂纹不会扩展到临界尺寸，通过定期无损检测发现裂纹。

  - id: "struct-mis-003-composite-stronger-everything"
    misconception: "复合材料比金属强，所以应该全机都用复合材料。"
    correction: "复合材料比强度高但成本高、损伤检测难、修理复杂，需在减重、成本、可维修性之间权衡。"
    explanation: >
      复合材料比强度（强度/密度）远高于金属，但不是"什么都好"。成本高（原材料和制造工艺贵）、
      损伤检测难（内部损伤肉眼看不见，需超声/X 射线）、修理复杂（不像金属可以铆接，需现场铺层+热压罐固化）。
      C919 复合材料占约 12%，主要用于尾翼、整流罩等部位；中央翼盒原计划用复材，为降低风险改回铝合金。
      "全机用复材"是忽略了成本和可维修性的权衡。

  - id: "struct-mis-004-aluminum-outdated"
    misconception: "铝合金是过时材料，C919 应该全用复合材料。"
    correction: "铝合金仍占 C919 结构 68%，成熟可靠、成本可控、可维修性好，是主体材料。"
    explanation: >
      虽然复合材料是亮点，但 C919 铝合金仍占约 68%，是主体材料。铝合金成熟可靠、加工容易、成本可控、可维修性好
      （可铆接、可敲修）。复合材料用于尾翼、整流罩等部位是为了减重和复杂形状成型。把铝合金说成"过时"
      是忽略了成熟度和可维修性的工程权衡。

  - id: "struct-mis-005-titanium-rare-use"
    misconception: "钛合金用得少说明不重要。"
    correction: "钛合金占 C919 约 7%，用于发动机吊架、起落架主结构等关键受力部位，是"少而精"的关键材料。"
    explanation: >
      C919 钛合金占约 7%，看似比例不高，但用于发动机吊架、起落架主结构、高应力紧固件等关键受力部位。
      钛合金强度高、耐高温、抗腐蚀，但成本高、加工难，所以"少而精"地用于最关键的部位。
      把"用得少"等同于"不重要"是误解了材料选用的工程逻辑。

  - id: "struct-mis-006-landing-gear-car-wheel"
    misconception: "飞机起落架和汽车悬挂差不多。"
    correction: "飞机起落架要承受着陆冲击数倍于自重、高压、高温，与汽车悬挂完全不同。"
    explanation: >
      飞机起落架要承受着陆瞬间数倍于自重的冲击（设计极限下沉速度 3.6 m/s）、刹车高温（> 500℃）、
      轮胎高压（约 14 个大气压）。结构是油气缓冲支柱+侧撑杆+扭力臂，按 CCAR-25.473/.735/.571 验证。
      把起落架等同于汽车悬挂，是低估了其工况的严苛程度。

  - id: "struct-mis-007-wing-flex-break"
    misconception: "机翼在飞行中晃动太多会断。"
    correction: "机翼按 CCAR-25.305 设计，可承受极限载荷（约 3.75g）的弯曲，正常飞行中的弹性变形是设计预期。"
    explanation: >
      机翼在飞行中有弹性变形（翼尖可上下移动数米），这是设计预期，不是缺陷。机翼按 CCAR-25.305 强度变形设计，
      安全系数 1.5，极限载荷约 +3.75g/-1.5g（CCAR-25.337）。静力试验验证到极限载荷不破坏。
      弹性变形反而帮助吸收颠簸载荷，降低结构应力集中。

  - id: "struct-mis-008-center-box-composite-failure"
    misconception: "C919 中央翼盒从复合材料改回铝合金，说明复合材料不行。"
    correction: "改回铝合金是为降低设计与认证风险，不是复合材料本身不行；B787/A350 大量使用复合材料中央翼盒。"
    explanation: >
      C919 中央翼盒原计划用复合材料减重，为降低设计与认证风险最终改为铝合金。这是"用气动/结构收益换研制风险"的工程权衡，
      不是复合材料本身不行。B787/A350 等更晚研制的机型大量使用复合材料中央翼盒，证明技术可行。
      C919 作为中国首款大型客机，选用成熟材料降低风险是合理决策。
