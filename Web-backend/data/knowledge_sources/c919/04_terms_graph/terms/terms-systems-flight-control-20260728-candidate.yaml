# C919 飞控类术语
# 领域：飞行控制系统
# 条目数：12
# node_type 统一为 system
# ID 前缀：fc_

terms:
  - term_id: "fc_001"
    canonical_name: "电传操纵"
    aliases: ["电传操纵", "fly-by-wire", "FBW", "电传飞控"]
    node_type: "system"
    definition: "用电气信号取代机械拉杆传递驾驶员指令的飞控系统，C919 全权限数字式电传飞控采用三余度架构"
    source_ref: "Wikipedia Comac C919 + 航空工程通用知识"

  - term_id: "fc_002"
    canonical_name: "控制律"
    aliases: ["控制律", "control law", "控制规律"]
    node_type: "system"
    definition: "飞控计算机将驾驶员输入和飞机状态转换为舵面指令的算法，C919 控制律实现正常/降级/直接三级模式"
    source_ref: "Wikipedia Comac C919 + 航空工程通用知识"

  - term_id: "fc_003"
    canonical_name: "正常模式"
    aliases: ["正常模式", "normal mode", "正常控制律"]
    node_type: "system"
    definition: "飞控全功能工作模式，提供增稳和包线保护，C919 正常模式保证最佳操纵品质和安全性"
    source_ref: "Wikipedia Comac C919 + 航空工程通用知识"

  - term_id: "fc_004"
    canonical_name: "备用模式"
    aliases: ["备用模式", "alternate mode", "降级模式", "备用控制律"]
    node_type: "system"
    definition: "飞控部分功能失效后的降级模式，丧失部分包线保护，C919 备用模式在故障时自动切换"
    source_ref: "Wikipedia Comac C919 + 航空工程通用知识"

  - term_id: "fc_005"
    canonical_name: "直接模式"
    aliases: ["直接模式", "direct mode", "直接控制律"]
    node_type: "system"
    definition: "飞控最简化模式，驾驶员指令直接对应舵面偏转无增稳，C919 直接模式作为最后备份保证安全着陆"
    source_ref: "Wikipedia Comac C919 + 航空工程通用知识"

  - term_id: "fc_006"
    canonical_name: "包线保护"
    aliases: ["包线保护", "envelope protection", "飞行包线保护"]
    node_type: "system"
    definition: "飞控防止飞机超出安全飞行边界的功能，C919 包线保护涵盖俯仰、坡度、失速和超速"
    source_ref: "Wikipedia Comac C919 + 航空工程通用知识"

  - term_id: "fc_007"
    canonical_name: "俯仰保护"
    aliases: ["俯仰保护", "pitch protection", "俯仰姿态保护"]
    node_type: "system"
    definition: "防止飞机俯仰角超出安全范围的飞控功能，C919 俯仰保护限制过大上仰和下俯"
