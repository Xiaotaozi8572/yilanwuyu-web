    node_type: "system"
    definition: "防止飞机坡度角超出安全范围的飞控功能，C919 坡度保护限制过大滚转角"
    source_ref: "Wikipedia Comac C919 + 航空工程通用知识"

  - term_id: "fc_009"
    canonical_name: "失速保护"
    aliases: ["失速保护", "stall protection", "失速预防"]
    node_type: "system"
    definition: "防止飞机进入失速的飞控功能，含抖杆器和自动推杆，C919 失速保护通过迎角限制和抖振预警实现"
    source_ref: "Wikipedia Comac C919 + 航空工程通用知识"

  - term_id: "fc_010"
    canonical_name: "超速保护"
    aliases: ["超速保护", "overspeed protection", "速度保护"]
    node_type: "system"
    definition: "防止飞机速度超过最大允许速度的飞控功能，C919 超速保护自动拉起或减速"
