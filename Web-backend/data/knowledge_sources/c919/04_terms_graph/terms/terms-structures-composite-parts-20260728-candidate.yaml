    node_type: "concept"
    definition: "固化后将构件从模具分离的过程，需用脱模剂避免粘连，C919 复合件脱模后进行修边和无损检测"
    source_ref: "Wikipedia Comac C919 + 航空工程通用知识"

  - term_id: "compart_010"
    canonical_name: "修补"
    aliases: ["修补", "repair", "复合材料修补", "补片修补"]
